<script id="td-core">
const TD = (function () {
  const EMPTY = "Không Có !";
  const NOTE = /^không có tượng riêng$/i;
  const REF = /^[A-I]\d{2}$/;
  const SECS = ["A_DINH_DANH","B_TUONG_TONG_QUAT","C_NHAN_VAT","D_TINH_CACH","E_NHAN_THE_TAT_BENH",
    "F_THIEN_TUONG","G_VAT_TUONG","H_DONG_VAT_NOI_CHON","I_THOI_GIAN_PHUONG_VI_MAU_SAC","M_MAP_20_MUC"];
  const ALIAS = { "kiền": "càn" };
  const norm = s => String(s).normalize("NFC").trim().toLowerCase();

  function splitVals(v) {
    const parts = v.split("|").map(s => s.trim()).filter(s => s && !NOTE.test(s));
    return parts.length ? parts : [EMPTY];
  }

  function load(text) {
    const issues = [], ques = [];
    let cur = null, sec = null;
    String(text).replace(/\r/g, "").split("\n").forEach((raw, i) => {
      const l = raw.normalize("NFC").trim();
      if (!l || l.startsWith("```")) return;
      if (l === "[QUE]") {
        cur = { meta: {}, secs: {}, list: [], byCode: {}, end: null, line: i + 1 };
        sec = null; ques.push(cur); return;
      }
      if (!cur) return;
      if (/^\[HET_/.test(l)) { cur.end = l; cur = null; sec = null; return; }
      let m = l.match(/^\[([A-Z0-9_]+)\]$/);
      if (m) { sec = m[1]; cur.secs[sec] = []; return; }
      m = l.match(/^([A-Z]\d{2})\.([A-Z0-9_]+)=(.*)$/);
      if (m && sec) {
        const e = { sec, code: m[1], name: m[2], vals: splitVals(m[3]) };
        e.empty = e.vals.length === 1 && e.vals[0] === EMPTY;
        e.isRef = !e.empty && e.vals.every(x => REF.test(x));
        if (cur.list.some(x => x.code === e.code && x.name === e.name))
          issues.push("Dòng " + (i + 1) + ": key trùng " + m[1] + "." + m[2]);
        cur.secs[sec].push(e); cur.list.push(e);
        if (sec !== "M_MAP_20_MUC") {
          if (cur.byCode[e.code]) issues.push("Dòng " + (i + 1) + ": mã trùng " + e.code);
          cur.byCode[e.code] = e;
        }
        return;
      }
      m = l.match(/^([A-Z_]+)=(.*)$/);
      if (m && !sec) { cur.meta[m[1]] = m[2].trim(); return; }
      issues.push("Dòng " + (i + 1) + ": không đọc được \"" + l.slice(0, 50) + "\"");
    });

    ques.forEach(q => {
      q.id = parseInt(q.meta.ID, 10);
      q.ten = q.meta.TEN || EMPTY;
      q.sec = s => q.secs[s] || [];
      q.val = (code, name) => {
        const e = q.list.find(x => x.code === code && (!name || x.name === name));
        return e ? e.vals : [EMPTY];
      };
      q.m = n => {
        const c = "M" + String(n).padStart(2, "0"), o = {};
        q.sec("M_MAP_20_MUC").filter(e => e.code === c).forEach(e => { o[e.name] = e.vals; });
        return o;
      };
      q.expand = vals => vals.filter(v => REF.test(v)).map(c => {
        const e = q.byCode[c];
        return { code: c, name: e ? e.name : null, vals: e ? e.vals : [EMPTY] };
      });
      const tag = "Quẻ " + (q.meta.TEN || ("dòng " + q.line));
      if (isNaN(q.id)) issues.push(tag + ": thiếu ID");
      if (!q.end) issues.push(tag + ": thiếu dòng [HET_QUE_...]");
      else if (!isNaN(q.id) && !q.end.endsWith("_" + String(q.id).padStart(2, "0") + "]"))
        issues.push(tag + ": dấu kết thúc không khớp ID (" + q.end + ")");
      SECS.forEach(s => { if (!q.secs[s]) issues.push(tag + ": thiếu tầng [" + s + "]"); });
      for (let n = 1; n <= 20; n++) {
        const o = q.m(n);
        if (!o.TEN) issues.push(tag + ": thiếu M" + String(n).padStart(2, "0") + ".TEN");
        if (!o.REF) issues.push(tag + ": thiếu M" + String(n).padStart(2, "0") + ".REF");
      }
      q.list.forEach(e => {
        if (e.isRef) e.vals.forEach(c => {
          if (!q.byCode[c]) issues.push(tag + ": " + e.code + "." + e.name + " trỏ tới mã không có " + c);
        });
      });
    });
    const ids = ques.map(q => q.id);
    ids.forEach((id, i) => { if (ids.indexOf(id) !== i) issues.push("ID " + id + " bị trùng giữa hai quẻ"); });
    if (ques.length && ques.length !== 8) issues.push("Có " + ques.length + " quẻ, cần 8");

    return {
      EMPTY, ques, issues,
      get(x) {
        if (typeof x === "number" || /^\d+$/.test(String(x))) return ques.find(q => q.id === +x) || null;
        const n = norm(x), t = ALIAS[n] || n;
        return ques.find(q => norm(q.ten) === t) || null;
      }
    };
  }
  return { EMPTY, load, SECS };
})();
</script>

<script id="td-ui">
(function () {
  const GLYPH = { 1:"☰", 2:"☱", 3:"☲", 4:"☳", 5:"☴", 6:"☵", 7:"☶", 8:"☷" };
  const NAMES = { 1:"Càn", 2:"Đoài", 3:"Ly", 4:"Chấn", 5:"Tốn", 6:"Khảm", 7:"Cấn", 8:"Khôn" };
  const SEC_TITLE = {
    A_DINH_DANH:"Định danh", B_TUONG_TONG_QUAT:"Tượng tổng quát", C_NHAN_VAT:"Nhân vật",
    D_TINH_CACH:"Tính cách", E_NHAN_THE_TAT_BENH:"Nhân thể và tật bệnh", F_THIEN_TUONG:"Thiên tượng",
    G_VAT_TUONG:"Vật tượng", H_DONG_VAT_NOI_CHON:"Động vật và nơi chốn",
    I_THOI_GIAN_PHUONG_VI_MAU_SAC:"Thời gian, phương vị, màu sắc", M_MAP_20_MUC:"20 mục ứng dụng"
  };
  const $ = id => document.getElementById(id);
  function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

  const raw = $("td-data").textContent;
  const db = TD.load(raw);
  window.TD = TD;
  window.TuongDon = db;

  const st = $("status");
  if (!db.ques.length) {
    st.textContent = "Chưa có data, hãy chèn text 8 quẻ vào khối td-data";
    st.className = "status bad";
  } else {
    st.textContent = "Đã đọc " + db.ques.length + " quẻ, " + (db.issues.length ? db.issues.length + " điểm cần xem" : "không có lỗi");
    st.className = "status" + (db.issues.length ? " bad" : "");
  }
  if (db.issues.length) {
    const box = el("div", "issues", "Kiểm tra data:");
    const ul = el("ul");
    db.issues.slice(0, 40).forEach(t => ul.appendChild(el("li", null, t)));
    if (db.issues.length > 40) ul.appendChild(el("li", null, "và " + (db.issues.length - 40) + " điểm nữa"));
    box.appendChild(ul); $("issues").appendChild(box);
  }

  function chips(q, e) {
    const c = el("div", "chips");
    e.vals.forEach(v => {
      let cls = "chip";
      if (v === TD.EMPTY) cls += " empty"; else if (e.isRef) cls += " ref";
      const s = el("span", cls, v);
      if (e.isRef && q.byCode[v]) s.title = q.byCode[v].name;
      c.appendChild(s);
    });
    return c;
  }

  function section(q, secName) {
    const entries = q.sec(secName);
    const d = el("details"); d.appendChild(el("summary", null, SEC_TITLE[secName] || secName));
    const body = el("div", "body");
    if (!entries.length) body.appendChild(el("div", "row")).appendChild(chips(q, { vals: [TD.EMPTY] }));
    const groups = [], idx = {};
    entries.forEach(e => { if (!(e.code in idx)) { idx[e.code] = groups.length; groups.push([]); } groups[idx[e.code]].push(e); });
    groups.forEach(g => {
      const row = el("div", "row");
      if (secName === "M_MAP_20_MUC") {
        const t = g.find(e => e.name === "TEN");
        row.appendChild(el("p", "mt", g[0].code + " " + (t ? t.vals[0] : "")));
        g.filter(e => e.name !== "TEN").forEach(e => {
          const k = el("div", "k"); k.appendChild(el("b", null, e.name)); row.appendChild(k); row.appendChild(chips(q, e));
        });
      } else {
        g.forEach(e => {
          const k = el("div", "k"); k.appendChild(el("b", null, e.code)); k.appendChild(document.createTextNode(e.name));
          row.appendChild(k); row.appendChild(chips(q, e));
        });
      }
      body.appendChild(row);
    });
    d.appendChild(body); return d;
  }

  function show(id) {
    const view = $("view"); view.textContent = "";
    document.querySelectorAll("#glyphs button").forEach(b => b.setAttribute("aria-current", String(+b.dataset.id === id)));
    const q = db.get(id);
    if (!q) { view.appendChild(el("p", "meta", "Quẻ " + id + " chưa có trong data. Không Có !")); return; }
    const head = el("div", "head");
    head.appendChild(el("h2", null, (GLYPH[q.id] || "") + " " + q.ten));
    view.appendChild(head);
    const mt = ["ID " + q.meta.ID];
    if (q.meta.TEN_KHAC) mt.push("tên khác " + q.meta.TEN_KHAC);
    if (q.end) mt.push(q.end);
    view.appendChild(el("p", "meta", mt.join(", ")));
    TD.SECS.forEach(s => view.appendChild(section(q, s)));
    history.replaceState(null, "", "#" + q.id);
  }

  const g = $("glyphs");
  for (let i = 1; i <= 8; i++) {
    const q = db.get(i);
    const b = el("button"); b.type = "button"; b.dataset.id = i; b.setAttribute("role", "tab");
    b.appendChild(el("span", "g", GLYPH[i])); b.appendChild(el("span", "n", i + " " + (q ? q.ten : NAMES[i])));
    if (!q) b.disabled = true;
    b.addEventListener("click", () => show(i));
    g.appendChild(b);
  }
  $("openAll").addEventListener("click", () => document.querySelectorAll("#view details").forEach(d => d.open = true));
  $("closeAll").addEventListener("click", () => document.querySelectorAll("#view details").forEach(d => d.open = false));
  const start = parseInt(location.hash.slice(1), 10);
  show(db.get(start) ? start : (db.ques[0] ? db.ques[0].id : 1));
})();
</script>
</body>
</html
