<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HỆ THỐNG TRUY XUẤT CHUẨN ĐÚNG</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 10px; background: #f0f0f0; }
        .container { max-width: 100%; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #b71c1c; font-size: 24px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; font-size: 20px; margin-bottom: 5px; color: #333; }
        input {
            width: 100%; padding: 16px; border: 3px solid #333; border-radius: 10px;
            font-size: 22px; font-weight: bold; box-sizing: border-box; background: #fffde7;
        }
        input.ok { border-color: #2e7d32; background: #e8f5e9; }

        /* ===== GỢI Ý AUTO-FILL ===== */
        .sug { display: none; margin-top: 6px; border: 2px solid #1565c0; border-radius: 10px; overflow: hidden; background: #fff; }
        .sug-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 16px; font-size: 20px; font-weight: bold; color: #0d47a1;
            border-bottom: 1px solid #bbdefb; cursor: pointer;
        }
        .sug-item:last-child { border-bottom: none; }
        .sug-item:active { background: #bbdefb; }
        .sug-item small { font-size: 15px; color: #555; font-weight: normal; margin-left: 10px; text-align: right; }

        #result-area {
            margin-top: 20px; padding: 15px; border: 4px solid #b71c1c; border-radius: 10px;
            min-height: 250px; white-space: pre-wrap; background: #fff;
            font-size: 22px; line-height: 1.6; font-weight: bold; color: #000;
        }
        .btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        button {
            padding: 20px; font-size: 22px; font-weight: bold; border: none;
            border-radius: 10px; color: #fff; text-transform: uppercase;
        }
        .btn-run { background: #b71c1c; }
        .btn-copy { background: #1565c0; }
    </style>
</head>
<body>

<div class="container">
    <h2>TRA CỨU THỐNG NHẤT</h2>

    <div class="form-group"><label>Lá 1:</label><input type="text" class="card-input" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="vd: tuong xanh d"></div>
    <div class="form-group"><label>Lá 2:</label><input type="text" class="card-input" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
    <div class="form-group"><label>Lá 3:</label><input type="text" class="card-input" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
    <div class="form-group"><label>Lá 4:</label><input type="text" class="card-input" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>

    <div class="btn-group">
        <button class="btn-run" onclick="extractData()">TRÍCH XUẤT DATA</button>
        <button class="btn-copy" onclick="copyData()">SAO CHÉP KẾT QUẢ</button>
    </div>

    <div id="result-area"></div>
</div>

<script>
    // DÁN DATA FILE 01 VÀO ĐÂY (GIỮA HAI DẤU ` )
    const DATABASE = `
** nạp data here **
    `;

    /* =====================================================
       PHẦN 1: AUTO-FILL / AUTO-CORRECT
       Cấu trúc nhập:  QUÂN  +  MÀU  +  VỊ TRÍ (tùy chọn)
       - Bỏ dấu cũng được: "tuong xanh d" -> TƯỚNG XANH Đ
       - Không có vị trí = nghĩa chung của quân bài
       ===================================================== */

    const PIECES = ['TƯỚNG', 'SĨ', 'TƯỢNG', 'XE', 'PHÁO', 'NGỰA', 'CHỐT'];
    const COLORS = ['XANH', 'VÀNG', 'TRẮNG', 'ĐỎ'];

    // Bỏ dấu + viết hoa để so khớp (Đ -> D)
    function norm(s) {
        return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[đĐ]/g, 'D').toUpperCase().replace(/\s+/g, ' ').trim();
    }

    // Khoảng cách chỉnh sửa (để sửa lỗi gõ sai 1 ký tự)
    function lev(a, b) {
        const m = a.length, n = b.length;
        if (!m) return n; if (!n) return m;
        let prev = Array.from({ length: n + 1 }, (_, j) => j);
        for (let i = 1; i <= m; i++) {
            const cur = [i];
            for (let j = 1; j <= n; j++) {
                cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
            }
            prev = cur;
        }
        return prev[n];
    }

    const LEVELS = [
        PIECES.map(t => ({ text: t, aliases: [norm(t)] })),
        COLORS.map(t => ({ text: t, aliases: [norm(t)] })),
        [
            { text: 'Đ', aliases: ['D', 'DUNG'] },
            { text: 'N', aliases: ['N', 'NGUOC'] }
        ]
    ];

    // Mọi ký tự CÓ DẤU mà người dùng đã gõ phải trùng đúng ký tự ở cùng vị trí của từ chuẩn
    // (ký tự không dấu thì bỏ qua -> gõ "tuong" vẫn ra cả TƯỚNG lẫn TƯỢNG)
    function diacriticOk(rawTok, text) {
        for (let k = 0; k < rawTok.length; k++) {
            const c = rawTok[k];
            if (norm(c) !== c && text[k] !== c) return false;
        }
        return true;
    }

    // Phân tích chuỗi nhập thành các trạng thái khả dĩ
    function engine(value) {
        let raw = value.replace(/^\s*\d+\s*[:.\-]\s*/, '');
        const endsSpace = /\s$/.test(raw);
        let tokens = norm(raw).split(' ').filter(Boolean);
        // rawTokens: giữ nguyên dấu người dùng gõ (để phân biệt TƯỚNG / TƯỢNG)
        let rawTokens = raw.normalize('NFC').toUpperCase().split(/\s+/).filter(Boolean);
        if (endsSpace) { tokens.push(''); rawTokens.push(''); }
        if (tokens.length === 0) { tokens = ['']; rawTokens = ['']; }
        tokens = tokens.slice(0, 3);
        rawTokens = rawTokens.slice(0, 3);

        let states = [{ parts: [], chung: false }];
        tokens.forEach((tok, i) => {
            const last = i === tokens.length - 1;
            const next = [];
            states.forEach(s => {
                // Token rỗng ở vị trí thứ 3 = chọn "nghĩa chung"
                if (i === 2 && tok === '' && last) next.push({ parts: s.parts, chung: true });

                const opts = LEVELS[i];
                let hits = opts.filter(o => o.aliases.some(a => last ? a.startsWith(tok) : (a === tok || a.startsWith(tok))));
                // Nếu người dùng đã gõ dấu (TƯỚNG, TƯỢNG, ĐỎ...) thì dấu phải khớp đúng
                if (i < 2) hits = hits.filter(o => diacriticOk(rawTokens[i], o.text));
                if (!hits.length && tok.length >= 3) {
                    hits = opts.filter(o => o.aliases.some(a => {
                        const cmp = last ? a.slice(0, Math.max(tok.length, 1)) : a;
                        return lev(cmp, tok) <= 1;
                    }));
                }
                hits.forEach(o => next.push({
                    parts: [...s.parts, o.text],
                    chung: false,
                    exact: o.aliases.includes(tok)
                }));
            });
            states = next;
        });
        return { states, tokens };
    }

    // Danh sách gợi ý hiển thị
    function getSuggestions(value) {
        let { states } = engine(value);

        // Gõ đúng hẳn 1 cấp thì mở luôn cấp tiếp theo
        if (states.length && states.every(s => s.exact) && states[0].parts.length < 3) {
            states = states.flatMap(s => {
                const lvl = s.parts.length;
                const arr = [];
                if (lvl === 2) arr.push({ parts: s.parts, chung: true });
                LEVELS[lvl].forEach(o => arr.push({ parts: [...s.parts, o.text], chung: false }));
                return arr;
            });
        }

        const seen = new Set();
        const list = [];
        states.forEach(s => {
            const text = s.parts.join(' ');
            if (!text) return;
            const key = text + '|' + s.chung;
            if (seen.has(key)) return;
            seen.add(key);
            const complete = s.parts.length === 3 || s.chung;
            let label = '›';
            if (s.chung) label = 'NGHĨA CHUNG';
            else if (s.parts.length === 3) label = s.parts[2] === 'Đ' ? 'ĐỨNG (Đ)' : 'NGƯỢC (N)';
            list.push({ text, fill: complete ? text : text + ' ', label });
        });
        return list.slice(0, 12);
    }

    // Chuẩn hóa chuỗi cuối cùng -> danh sách kết quả hợp lệ
    function resolveFinal(value) {
        const v = value.trim();
        if (!v) return [];
        const { states, tokens } = engine(v);
        const out = [];
        states.forEach(s => {
            if (s.parts.length === tokens.length && s.parts.length >= 2) {
                const t = s.parts.join(' ');
                if (!out.includes(t)) out.push(t);
            }
        });
        return out;
    }

    // Tự sửa lại ô nhập khi chỉ có 1 khả năng duy nhất
    function autoFix(inp) {
        const v = inp.value.trim();
        if (!v) { inp.classList.remove('ok'); return; }
        const cands = resolveFinal(v);
        if (cands.length === 1) {
            inp.value = cands[0];
            inp.classList.add('ok');
            return;
        }
        inp.classList.remove('ok');
        // Mới nhập quân bài (vd "xe") mà chỉ có 1 khả năng -> sửa thành XE
        const { states, tokens } = engine(v);
        if (tokens.length === 1 && states.length === 1) inp.value = states[0].parts[0];
    }

    document.querySelectorAll('.card-input').forEach(inp => {
        const box = document.createElement('div');
        box.className = 'sug';
        inp.parentNode.appendChild(box);

        function render() {
            inp.classList.remove('ok');
            const list = getSuggestions(inp.value);
            box.innerHTML = '';
            if (!list.length) { box.style.display = 'none'; return; }
            list.forEach(item => {
                const div = document.createElement('div');
                div.className = 'sug-item';
                div.innerHTML = '<span></span><small></small>';
                div.firstChild.textContent = item.text;
                div.lastChild.textContent = item.label;
                // pointerdown + preventDefault: không làm ô nhập mất focus
                div.addEventListener('pointerdown', e => {
                    e.preventDefault();
                    inp.value = item.fill;
                    inp.focus();
                    render();
                    if (item.fill === item.text) inp.classList.add('ok');
                    if (item.fill === item.text) box.style.display = 'none';
                });
                box.appendChild(div);
            });
            box.style.display = 'block';
        }

        inp.addEventListener('input', render);
        inp.addEventListener('focus', render);
        inp.addEventListener('blur', () => {
            setTimeout(() => { box.style.display = 'none'; autoFix(inp); }, 120);
        });
        inp.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const list = getSuggestions(inp.value);
                if (list.length) { inp.value = list[0].fill; render(); }
                autoFix(inp);
            }
        });
    });

    /* =====================================================
       PHẦN 2: TRÍCH XUẤT DATA
       ===================================================== */

    function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    function extractData() {
        const inputs = document.querySelectorAll('.card-input');
        const resultArea = document.getElementById('result-area');
        let finalResults = [];
        const lines = DATABASE.normalize('NFC').split('\n');

        inputs.forEach(input => {
            let val = input.value.trim();
            if (!val) return;

            // Tự sửa chuẩn trước khi tra cứu
            const cands = resolveFinal(val);
            if (cands.length > 1) {
                finalResults.push("⚠️ CHƯA RÕ: " + val + "\nVui lòng chọn 1 trong: " + cands.join("  |  "));
                return;
            }
            if (cands.length === 0) {
                finalResults.push("❌ KHÔNG KHỚP DỮ LIỆU: " + val);
                return;
            }

            const searchKey = cands[0].normalize('NFC').toUpperCase();
            input.value = searchKey;
            input.classList.add('ok');

            const isChung = searchKey.split(' ').length === 2;
            const keyRe = isChung
                ? new RegExp('^\\s*(\\d+\\.\\s*)?' + escapeRe(searchKey) + '\\s*:?\\s*$')
                : new RegExp('^\\s*' + escapeRe(searchKey) + '\\s*:');

            let foundIdx = -1;
            for (let i = 0; i < lines.length; i++) {
                if (keyRe.test(lines[i].toUpperCase())) { foundIdx = i; break; }
            }

            if (foundIdx !== -1) {
                let segment = [lines[foundIdx]];

                for (let j = foundIdx + 1; j < lines.length; j++) {
                    let lineText = lines[j].trim();
                    if (lineText === "") continue;

                    // Gặp dòng nhãn (CHỮ HOA + dấu ":") của lá khác -> DỪNG
                    const m = lineText.match(/^(\d+\.\s*)?([^:]{1,40}?)\s*:/);
                    if (m && m[2] === m[2].toUpperCase()) {
                        if (m[2].trim() !== searchKey) break;
                    }

                    // Gặp dòng tiêu đề nhóm (vd: 4. PHÁO ĐỎ) -> DỪNG
                    if (/^\d+\./.test(lineText)) break;

                    segment.push(lines[j]);
                }
                finalResults.push(segment.join('\n').trim());
            } else {
                finalResults.push("❌ KHÔNG KHỚP DỮ LIỆU: " + searchKey);
            }
        });

        resultArea.innerText = finalResults.join("\n\n--------------------\n\n");
    }

    function copyData() {
        const text = document.getElementById('result-area').innerText;
        if (!text) return;
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        alert("Đã sao chép!");
    }
</script>

</body>
</html>
