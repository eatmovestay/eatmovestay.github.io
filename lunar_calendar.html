<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Âm Dương & Tiết Khí</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink:       #1a1a2e;
            --ink-soft:  #4a4a6a;
            --paper:     #fdfaf5;
            --paper-alt: #f5f0e8;
            --gold:      #c9a84c;
            --gold-lt:   #e8d5a0;
            --red:       #c0392b;
            --teal:      #2a7f7f;
            --teal-lt:   #e8f4f4;
            --violet:    #6b4fa0;
            --violet-lt: #eee8f7;
            --sunday:    #b03030;
            --saturday:  #2a6060;
            --today-bg:  #fff8e1;
            --today-bd:  #c9a84c;
            --radius:    12px;
            --shadow:    0 4px 24px rgba(26,26,46,0.08);
            --shadow-md: 0 8px 32px rgba(26,26,46,0.12);
        }

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            padding-top: 72px;
        }

        header {
            position: fixed;
            inset: 0 0 auto 0;
            height: 64px;
            background: var(--ink);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            z-index: 999;
            box-shadow: 0 2px 16px rgba(0,0,0,.25);
        }
        .logo {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: .5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo svg { width:22px; height:22px; flex-shrink:0; }
        .nav-home a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--gold-lt);
            text-decoration: none;
            font-size: .875rem;
            font-weight: 500;
            padding: 6px 14px;
            border: 1px solid rgba(201,168,76,.4);
            border-radius: 20px;
            transition: all .2s;
        }
        .nav-home a:hover { background: rgba(201,168,76,.15); color: var(--gold); }

        .main {
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 16px 60px;
        }

        .page-title { text-align: center; margin-bottom: 22px; }
        .page-title h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: .5px;
        }
        .page-title p { color: var(--ink-soft); font-size: .875rem; margin-top: 4px; }
        .title-rule {
            width: 60px; height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--gold-lt));
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* ── REAL-TIME DUAL BANNER ── */
        .now-banner {
            background: linear-gradient(135deg, var(--ink) 0%, #2c2c4e 100%);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 22px;
            box-shadow: var(--shadow-md);
        }
        .now-banner .now-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .now-banner .now-head .clock {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 1rem;
            font-weight: 600;
        }
        .now-banner .now-head .refresh-note {
            font-size: .72rem;
            color: rgba(255,255,255,.5);
        }
        .now-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 560px) { .now-grid { grid-template-columns: 1fr; } }
        .now-card {
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 9px;
            padding: 12px 14px;
        }
        .now-card .now-card-label {
            font-size: .68rem;
            text-transform: uppercase;
            letter-spacing: .7px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .now-card.soc .now-card-label { color: var(--gold-lt); }
        .now-card.tiet .now-card-label { color: #7fd6d6; }
        .now-card .now-line {
            font-size: .84rem;
            color: rgba(255,255,255,.9);
            padding: 2px 0;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .now-card .now-line b { color: #fff; font-weight: 600; }
        .now-diff-note {
            grid-column: 1 / -1;
            font-size: .76rem;
            color: var(--gold-lt);
            background: rgba(201,168,76,.12);
            border: 1px solid rgba(201,168,76,.3);
            border-radius: 7px;
            padding: 7px 10px;
            margin-top: 2px;
            display: none;
        }
        .now-diff-note.show { display: block; }

        .controls {
            background: white;
            border: 1px solid #e8e2d6;
            border-radius: var(--radius);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }
        .ctrl-group { display: flex; align-items: center; gap: 8px; }
        .ctrl-group label {
            font-size: .8rem; font-weight: 600; color: var(--ink-soft);
            text-transform: uppercase; letter-spacing: .6px; white-space: nowrap;
        }
        select, input[type="number"] {
            padding: 8px 12px; font-size: .9rem; font-family: 'Be Vietnam Pro', sans-serif;
            font-weight: 500; border: 1.5px solid #ddd6c8; border-radius: 8px;
            background: var(--paper); color: var(--ink); outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        select:focus, input[type="number"]:focus {
            border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,.15);
        }
        select#month { min-width: 120px; }
        input#year { width: 90px; }

        .btn-primary {
            display: inline-flex; align-items: center; gap: 6px; padding: 9px 22px;
            background: var(--ink); color: var(--gold-lt); border: none; border-radius: 8px;
            font-family: 'Be Vietnam Pro', sans-serif; font-size: .875rem; font-weight: 600;
            cursor: pointer; transition: background .2s, transform .15s;
        }
        .btn-primary:hover { background: #2c2c4e; transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }

        .btn-secondary {
            display: inline-flex; align-items: center; gap: 6px; padding: 9px 20px;
            background: white; color: var(--ink); border: 1.5px solid #ddd6c8; border-radius: 8px;
            font-family: 'Be Vietnam Pro', sans-serif; font-size: .875rem; font-weight: 500;
            cursor: pointer; transition: all .2s; text-decoration: none;
        }
        .btn-secondary:hover { border-color: var(--gold); color: var(--gold); background: var(--today-bg); }
        .btn-red { background: var(--red); color: white; border-color: var(--red); }
        .btn-red:hover { background: #9b2222; color: white; border-color: #9b2222; }
        .btn-teal { border-color: var(--teal); color: var(--teal); }
        .btn-teal:hover { background: var(--teal-lt); border-color: var(--teal); color: var(--teal); }

        .calendar-card {
            background: white; border: 1px solid #e8e2d6; border-radius: var(--radius);
            overflow: hidden; box-shadow: var(--shadow); margin-bottom: 20px;
        }
        .calendar-month-header {
            background: var(--ink); padding: 14px 20px; display: flex;
            align-items: center; justify-content: space-between;
        }
        .calendar-month-header h3 {
            font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.1rem; font-weight: 600;
        }
        .calendar-month-header span { font-size: .8rem; color: rgba(255,255,255,.55); font-weight: 400; }

        table { width: 100%; border-collapse: collapse; }
        thead th {
            padding: 10px 4px; font-size: .72rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: .8px; color: var(--ink-soft); background: var(--paper-alt);
            border-bottom: 1px solid #e0d8cc;
        }
        thead th:first-child { color: var(--sunday); }
        thead th:last-child  { color: var(--saturday); }
        tbody td {
            padding: 0; border: 1px solid #f0ebe0; vertical-align: top;
            cursor: pointer; transition: background .15s; min-height: 64px;
        }
        tbody td:empty { cursor: default; background: var(--paper-alt); }
        tbody td:not(:empty):hover { background: #fffbf0; }
        .day-cell-inner {
            padding: 8px 6px 6px; min-height: 64px; display: flex;
            flex-direction: column; align-items: center; gap: 2px;
        }
        .day-solar { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 600; line-height: 1; color: var(--ink); }
        .day-lunar { font-size: .7rem; font-weight: 500; color: var(--ink-soft); line-height: 1; }
        .day-tietKhi {
            font-size: .6rem; font-weight: 600; color: var(--teal); background: var(--teal-lt);
            border-radius: 3px; padding: 1px 4px; line-height: 1.4; margin-top: 1px; text-align: center;
        }
        tbody td.sunday .day-solar { color: var(--sunday); }
        tbody td.saturday .day-solar { color: var(--saturday); }
        tbody td.today { background: var(--today-bg); border: 2px solid var(--today-bd); border-radius: 2px; }
        tbody td.today .day-solar { color: var(--gold); font-weight: 700; }

        .tietKhi-section {
            background: var(--teal-lt); border-left: 4px solid var(--teal);
            border-radius: 0 var(--radius) var(--radius) 0; padding: 14px 18px; margin: 0 0 20px;
        }
        .tietKhi-section h4 {
            font-size: .78rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: .7px; color: var(--teal); margin-bottom: 10px;
        }
        .tietKhi-list { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
        .tietKhi-list li {
            display: flex; align-items: center; gap: 6px; background: white;
            border: 1px solid rgba(42,127,127,.2); border-radius: 6px; padding: 5px 10px;
            font-size: .82rem; font-weight: 500; color: var(--ink);
        }
        .tietKhi-list li .tk-name { color: var(--teal); font-weight: 700; }
        .tietKhi-list li .tk-time { color: var(--ink-soft); font-size: .75rem; }
        .tietKhi-unavail { font-size: .85rem; color: var(--ink-soft); font-style: italic; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        @media (max-width: 580px) { .info-grid { grid-template-columns: 1fr; } }
        .info-panel { background: white; border: 1px solid #e8e2d6; border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
        .info-panel-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #f0ebe0; }
        .info-panel-icon { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: .9rem; flex-shrink: 0; }
        .icon-star { background: #fff3e0; }
        .icon-light { background: #fce4ec; }
        .info-panel h4 { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-soft); }
        .info-list { list-style: none; }
        .info-list li { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; font-size: .85rem; color: var(--ink); border-bottom: 1px solid #f5f0e8; }
        .info-list li:last-child { border-bottom: none; }
        .info-list li .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
        .dot-gold { background: var(--gold); }
        .dot-red  { background: var(--red); }
        .thienxa-item { background: #fff8f8; border: 1px solid #f5c6c6; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: .85rem; }
        .thienxa-item:last-child { margin-bottom: 0; }
        .thienxa-item .tx-date { font-weight: 700; color: var(--red); }
        .thienxa-item .tx-detail { color: var(--ink-soft); font-size: .78rem; margin-top: 2px; }
        .empty-note { font-size: .83rem; color: var(--ink-soft); font-style: italic; padding: 4px 0; }

        .tool-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 24px; }

        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(10,10,30,.55);
            backdrop-filter: blur(4px); z-index: 10000; align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: white; border-radius: 16px; width: 90%; max-width: 480px;
            padding: 28px 28px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
            animation: modalIn .2s ease; position: relative;
            max-height: 85vh; overflow-y: auto;
        }
        .modal-box.wide { max-width: 620px; }
        @keyframes modalIn { from { opacity:0; transform: translateY(16px) scale(.97); } to { opacity:1; transform: translateY(0) scale(1); } }
        .modal-box h3 { font-family: 'Playfair Display', serif; font-size: 1.15rem; color: var(--ink); margin-bottom: 18px; padding-right: 28px; }
        .modal-close {
            position: absolute; top: 18px; right: 18px; width: 28px; height: 28px; border-radius: 50%;
            background: var(--paper-alt); border: none; cursor: pointer; display: flex;
            align-items: center; justify-content: center; font-size: 1rem; color: var(--ink-soft); transition: background .15s;
        }
        .modal-close:hover { background: #eadec8; color: var(--ink); }

        .detail-grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: baseline; }
        .detail-grid .lbl { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-soft); white-space: nowrap; }
        .detail-grid .val { font-size: .95rem; font-weight: 600; color: var(--ink); }
        .detail-grid .val.highlight { color: var(--teal); }
        .detail-grid .val.tietKhi-val { color: var(--teal); font-weight: 700; }
        .detail-grid .val.canchi { color: var(--gold); }
        .detail-section-label {
            font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .7px;
            margin: 16px 0 8px; padding-top: 12px; border-top: 1px solid #f0ebe0;
        }
        .detail-section-label.soc { color: var(--gold); }
        .detail-section-label.tiet { color: var(--teal); }
        .transition-note {
            background: var(--violet-lt); border: 1px solid #d8c8ec; border-radius: 8px;
            padding: 10px 12px; font-size: .8rem; color: var(--violet); margin-top: 10px; line-height: 1.5;
        }

        .detail-date-badge {
            background: var(--ink); color: var(--gold); font-family: 'Playfair Display', serif;
            font-size: 2.5rem; font-weight: 700; text-align: center; padding: 12px;
            border-radius: 10px; margin-bottom: 16px; line-height: 1;
        }
        .detail-date-badge small { display: block; font-family: 'Be Vietnam Pro', sans-serif; font-size: .75rem; font-weight: 400; color: rgba(255,255,255,.6); margin-top: 4px; }

        .form-section { margin-bottom: 16px; }
        .form-section label { display: block; font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-soft); margin-bottom: 6px; }
        .form-row { display: flex; gap: 8px; }
        .form-row select  { flex: 2; }
        .form-row input   { flex: 1; }
        .form-row > input[placeholder="Ngày"] { flex: 1; min-width: 60px; }
        .form-row > input[placeholder="Năm"] { flex: 1.2; min-width: 80px; }

        .calc-result { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: .9rem; font-weight: 600; display: none; }
        .calc-result.ok  { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; display: block; }
        .calc-result.err { background: #fce4ec; color: #c62828; border: 1px solid #f8bbd9; display: block; }
        .calc-result .highlight-date { color: var(--gold); font-weight: 800; background: var(--ink); padding: 1px 6px; border-radius: 4px; }

        hr.modal-divider { border: none; border-top: 1px solid #f0ebe0; margin: 14px 0; }

        .year-ref-season { margin-bottom: 14px; }
        .year-ref-season h5 {
            font-size: .72rem; text-transform: uppercase; letter-spacing: .6px;
            color: var(--ink-soft); margin-bottom: 6px;
        }
        .year-ref-list { list-style: none; }
        .year-ref-list li {
            display: flex; justify-content: space-between; font-size: .85rem;
            padding: 5px 0; border-bottom: 1px dashed #f0ebe0;
        }
        .year-ref-list li:last-child { border-bottom: none; }
        .year-ref-list li .yr-name { font-weight: 600; color: var(--teal); }
        .year-ref-list li .yr-time { color: var(--ink-soft); font-size: .8rem; }

        @media (max-width: 480px) {
            .page-title h1 { font-size: 1.5rem; }
            .day-solar { font-size: 1.05rem !important; }
            .day-lunar { font-size: .62rem !important; }
            table { font-size: .75rem; }
            thead th { font-size: .65rem; padding: 8px 2px; }
            tbody td { min-height: 52px; }
            .day-cell-inner { padding: 5px 3px 4px; min-height: 52px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 2a10 10 0 0 1 0 20A10 10 0 0 1 12 2z" fill="rgba(201,168,76,.15)"/>
            <path d="M12 6v6l4 2"/>
        </svg>
        Lịch Âm Dương &amp; Tiết Khí
    </div>
    <nav class="nav-home">
        <a href="https://chudich.github.io/IChing.html">← Trang Chủ</a>
    </nav>
</header>

<main class="main">

    <div class="page-title">
        <h1>Lịch Âm Dương &amp; Tiết Khí</h1>
        <p>Song song lịch Sóc Vọng (Mặt Trăng) &amp; lịch Tiết Khí (Nguyệt Lệnh thật)</p>
        <div class="title-rule"></div>
    </div>

    <!-- REAL-TIME DUAL BANNER -->
    <div class="now-banner" id="nowBanner"></div>

    <div class="controls">
        <div class="ctrl-group">
            <label for="month">Tháng</label>
            <select id="month">
                <option value="1">Tháng 1</option><option value="2">Tháng 2</option>
                <option value="3">Tháng 3</option><option value="4">Tháng 4</option>
                <option value="5">Tháng 5</option><option value="6">Tháng 6</option>
                <option value="7">Tháng 7</option><option value="8">Tháng 8</option>
                <option value="9">Tháng 9</option><option value="10">Tháng 10</option>
                <option value="11">Tháng 11</option><option value="12">Tháng 12</option>
            </select>
        </div>
        <div class="ctrl-group">
            <label for="year">Năm</label>
            <input type="number" id="year" min="1900" max="2100" value="2025">
        </div>
        <button class="btn-primary" onclick="generateCalendar()">Xem lịch</button>
    </div>

    <div id="calendar"></div>

    <div class="info-grid">
        <div class="info-panel" id="importantDays">
            <div class="info-panel-header">
                <div class="info-panel-icon icon-star">⭐</div>
                <h4>Ngày quan trọng</h4>
            </div>
            <div id="importantDaysList"></div>
        </div>
        <div class="info-panel" id="thienXaDays">
            <div class="info-panel-header">
                <div class="info-panel-icon icon-light">✨</div>
                <h4>Ngày Thiên Xá</h4>
            </div>
            <div id="thienXaDaysList"></div>
        </div>
    </div>

    <div class="tool-row">
        <button class="btn-secondary" onclick="openModal('calcDaysModal')">📅 Tính số ngày</button>
        <button class="btn-secondary" onclick="openModal('findTimeModal')">🔍 Tìm thời điểm</button>
        <button class="btn-secondary btn-teal" onclick="openTietKhiYearModal(currentRealYear())">🌾 Tiết Khí năm hiện hành</button>
        <button class="btn-secondary btn-teal" onclick="openTietKhiYearModal()">📖 Tra Tiết Khí năm bất kỳ</button>
        <a href="https://chudich.github.io/phithienxa.html" style="text-decoration:none;">
            <button class="btn-secondary btn-red">🌟 Phi Thiên Xá</button>
        </a>
    </div>

</main>

<!-- Day detail -->
<div id="dayModal" class="modal-overlay" onclick="outsideClose(event,'dayModal')">
    <div class="modal-box">
        <button class="modal-close" onclick="closeModal('dayModal')">✕</button>
        <div id="modal-detail-content"></div>
    </div>
</div>

<!-- Calc days -->
<div id="calcDaysModal" class="modal-overlay" onclick="outsideClose(event,'calcDaysModal')">
    <div class="modal-box">
        <button class="modal-close" onclick="closeModal('calcDaysModal')">✕</button>
        <h3>📅 Tính số ngày</h3>
        <div class="form-section">
            <label>Chọn mốc thời gian</label>
            <div class="form-row">
                <input type="number" id="startDay" placeholder="Ngày" min="1" max="31">
                <select id="startMonth">
                    <option value="1">Th.1</option><option value="2">Th.2</option><option value="3">Th.3</option>
                    <option value="4">Th.4</option><option value="5">Th.5</option><option value="6">Th.6</option>
                    <option value="7">Th.7</option><option value="8">Th.8</option><option value="9">Th.9</option>
                    <option value="10">Th.10</option><option value="11">Th.11</option><option value="12">Th.12</option>
                </select>
                <input type="number" id="startYear" placeholder="Năm" min="1900" max="2100">
            </div>
        </div>
        <div class="form-section">

// Lịch Tiết Khí. Đây LUÔN là phần tử đầu tiên [0] của mỗi mảng tháng ở trên.
const TIET_TO_CHI = {
    "Tiểu Hàn":"Sửu", "Lập Xuân":"Dần", "Kinh Trập":"Mão", "Thanh Minh":"Thìn",
    "Lập Hạ":"Tỵ", "Mang Chủng":"Ngọ", "Tiểu Thử":"Mùi", "Lập Thu":"Thân",
    "Bạch Lộ":"Dậu", "Hàn Lộ":"Tuất", "Lập Đông":"Hợi", "Đại Tuyết":"Tý"
};
const CHI_FROM_DAN = ['Dần','Mão','Thìn','Tỵ','Ngọ','Mùi','Thân','Dậu','Tuất','Hợi','Tý','Sửu'];
const THIEN_CAN = ['Giáp','Ất','Bính','Đinh','Mậu','Kỷ','Canh','Tân','Nhâm','Quý'];

function getSolarTermsForMonth(year, month) {
    if (solarTermsDB[year] && solarTermsDB[year][month]) return solarTermsDB[year][month];
    return [];
}
function getTietKhiForDay(year, month, day) {
    const terms = getSolarTermsForMonth(year, month);
    const term = terms.find(t => t.day === day);
    return term ? term.name : null;
}

// Giờ trong data là giờ ICT (UTC+7) — quy đổi đúng sang mốc UTC thật để so
// sánh chính xác với "now", không phụ thuộc múi giờ trình duyệt người dùng.
function ictInstant(year, month, day, hh, mm) {
    return new Date(Date.UTC(year, month - 1, day, hh - 7, mm));
}

// Dựng "trục thời gian Tiết" (12 mốc/năm) trải toàn bộ solarTermsDB.
let _tietTimeline = null;
function buildTietTimeline() {
    if (_tietTimeline) return _tietTimeline;
    const list = [];
    Object.keys(solarTermsDB).map(Number).sort((a,b)=>a-b).forEach(year => {
        for (let m = 1; m <= 12; m++) {
            const terms = solarTermsDB[year][m];
            if (!terms || !terms.length) continue;
            const t = terms[0]; // phần tử [0] luôn là "Tiết" mở tháng
            if (!TIET_TO_CHI[t.name]) continue;
            const [hh, mm] = t.time.split(':').map(Number);
            list.push({
                name: t.name, chi: TIET_TO_CHI[t.name], year: year,
                day: t.day, month: m, hh, mm,
                instant: ictInstant(year, m, t.day, hh, mm)
            });
        }
    });
    list.sort((a,b) => a.instant - b.instant);
    _tietTimeline = list;
    return list;
}

const DIA_CHI_CHUAN = ['Tý','Sửu','Dần','Mão','Thìn','Tỵ','Ngọ','Mùi','Thân','Dậu','Tuất','Hợi'];
function canChiNamThat(year) {
    const canIdx = ((year - 4) % 10 + 10) % 10;
    const chiIdx = ((year - 4) % 12 + 12) % 12;
    return { can: THIEN_CAN[canIdx], chi: DIA_CHI_CHUAN[chiIdx], text: THIEN_CAN[canIdx] + ' ' + DIA_CHI_CHUAN[chiIdx] };
}

// Ngũ Hổ Độn: Can của tháng Dần theo Can của Năm (Tiết niên).
function stemOfDanFromYearCan(yearCanIdx) {
    return (2 * (yearCanIdx % 5) + 2) % 10;
}

/**
 * Tính Tháng/Năm theo TIẾT KHÍ THẬT cho một thời điểm bất kỳ (đối tượng Date UTC).
 * Trả về null nếu nằm ngoài phạm vi dữ liệu (trước Tiểu Hàn 2023).
 */
function getTietKhiThangNam(dateObj) {
    const timeline = buildTietTimeline();
    let curIdx = -1;
    for (let i = 0; i < timeline.length; i++) {
        if (timeline[i].instant.getTime() <= dateObj.getTime()) curIdx = i; else break;
    }
    if (curIdx === -1) return null;
    const curTiet = timeline[curIdx];

    let yearIdx = -1;
    for (let i = 0; i <= curIdx; i++) {
        if (timeline[i].name === 'Lập Xuân') yearIdx = i;
    }
    if (yearIdx === -1) return null; // trước Lập Xuân đầu tiên trong DB

    const namCC = canChiNamThat(timeline[yearIdx].year);
    const yearCanIdx = THIEN_CAN.indexOf(namCC.can);
    const stemDan = stemOfDanFromYearCan(yearCanIdx);
    const offset = CHI_FROM_DAN.indexOf(curTiet.chi);
    const thangCanIdx = (stemDan + offset) % 10;
    const thangCC = { can: THIEN_CAN[thangCanIdx], chi: curTiet.chi, text: THIEN_CAN[thangCanIdx] + ' ' + curTiet.chi };

    return {
        thangCanChi: thangCC, namCanChi: namCC,
        tietHienHanh: curTiet.name, tietInstant: curTiet.instant,
        tietDay: curTiet.day, tietMonth: curTiet.month, tietYear: curTiet.year,
        tietHH: curTiet.hh, tietMM: curTiet.mm
    };
}

// Kiểm tra 1 ngày dương lịch cụ thể có phải "ngày giao Tiết" (đổi Nguyệt
// Lệnh) hay không — nếu có, trả về thông tin trước/sau mốc giờ giao Tiết.
function getTietTransitionOnDay(year, month, day) {
    const timeline = buildTietTimeline();
    const idx = timeline.findIndex(t => t.year === year && t.month === month && t.day === day);
    if (idx === -1 || idx === 0) return null;
    const before = timeline[idx - 1];
    const after  = timeline[idx];
    const nowThis = getTietKhiThangNam(ictInstant(year, month, day, after.hh, after.mm));
    const beforeThis = getTietKhiThangNam(new Date(before.instant.getTime()));
    return {
        gioGiao: `${String(after.hh).padStart(2,'0')}:${String(after.mm).padStart(2,'0')}`,
        tietTen: after.name,
        thangTruoc: beforeThis ? beforeThis.thangCanChi.text : '—',
        namTruoc: beforeThis ? beforeThis.namCanChi.text : '—',
        thangSau: nowThis ? nowThis.thangCanChi.text : '—',
        namSau: nowThis ? nowThis.namCanChi.text : '—',
        doiNam: after.name === 'Lập Xuân'
    };
}

const LunarDateLib = window._calendar;

function getSocVongInfo(year, month, day) {
    try {
        const sd = new LunarDateLib.SolarDate({ day, month, year });
        const ld = sd.toLunarDate();
        ld.init();
        return {
            lunarDisp: ld.day + '/' + ld.month + (ld.leap ? 'ⁿ' : ''),
            lunarDay:  ld.day + '/' + ld.month + (ld.leap ? ' nhuận' : ''),
            ngayCC:  ld.getDayName()   || 'N/A',
            thangCC: ld.getMonthName() || 'N/A',
            namCC:   ld.getYearName()  || 'N/A'
        };
    } catch (e) { return null; }
}

function generateCalendar() {
    const month = parseInt(document.getElementById('month').value);
    const year  = parseInt(document.getElementById('year').value);
    const calDiv = document.getElementById('calendar');

    if (isNaN(year) || year < 1900 || year > 2100) {
        calDiv.innerHTML = '<p style="color:var(--red);padding:16px;font-weight:600;">Vui lòng nhập năm từ 1900 đến 2100.</p>';
        return;
    }

    const daysInMonth = new Date(year, month, 0).getDate();
    const firstDay    = new Date(year, month - 1, 1).getDay();

    const monthNames = ['','Tháng Một','Tháng Hai','Tháng Ba','Tháng Tư','Tháng Năm','Tháng Sáu',
                        'Tháng Bảy','Tháng Tám','Tháng Chín','Tháng Mười','Tháng Mười Một','Tháng Mười Hai'];

    const tietKhiNotes = buildTietKhiNotes(year, month);

    let tableHTML = `
    <table>
        <thead><tr><th>CN</th><th>T.2</th><th>T.3</th><th>T.4</th><th>T.5</th><th>T.6</th><th>T.7</th></tr></thead>
        <tbody>`;

    let day = 1, row = '<tr>', cellCount = 0;
    for (let i = 0; i < firstDay; i++) { row += '<td></td>'; cellCount++; }
    while (day <= daysInMonth) {
        row += getDayCell(year, month, day);
        cellCount++; day++;
        if (cellCount === 7) { tableHTML += row + '</tr>'; row = '<tr>'; cellCount = 0; }
    }
    if (cellCount > 0) {
        while (cellCount < 7) { row += '<td></td>'; cellCount++; }
        tableHTML += row + '</tr>';
    }
    tableHTML += '</tbody></table>';

    calDiv.innerHTML = `
        <div class="calendar-card">
            <div class="calendar-month-header">
                <h3>${monthNames[month]} ${year}</h3>
                <span>Lịch Âm Dương</span>
            </div>
            ${tableHTML}
        </div>
        ${tietKhiNotes}
    `;

    displayImportantDays(year, month);
    displayThienXaDays(year, month);
}

function buildTietKhiNotes(year, month) {
    const terms = getSolarTermsForMonth(year, month);
    if (terms.length === 0) {
        return `<div class="tietKhi-section">
            <h4>Tiết Khí Tháng Này</h4>
            <p class="tietKhi-unavail">Chưa có dữ liệu tiết khí cho năm ${year}. Dữ liệu có sẵn: 2023–2046.</p>
        </div>`;
    }
    const pad = n => String(n).padStart(2,'0');
    const listItems = terms.map(t =>
        `<li><span class="tk-name">${t.name}</span><span>—</span>
            <span>${pad(t.day)}/${pad(month)}/${year}</span>
            <span class="tk-time">${t.time} (ICT)</span></li>`
    ).join('');
    return `<div class="tietKhi-section">
        <h4>Tiết Khí Tháng Này</h4>
        <ul class="tietKhi-list">${listItems}</ul>
    </div>`;
}

function getDayCell(year, month, day) {
    const soc = getSocVongInfo(year, month, day);
    let lunarDisp = '?', lunarDay = 'N/A', canChiDay = 'N/A', canChiMonth = 'N/A', canChiYear = 'N/A';
    if (soc) {
        lunarDisp = soc.lunarDisp; lunarDay = soc.lunarDay;
        canChiDay = soc.ngayCC; canChiMonth = soc.thangCC; canChiYear = soc.namCC;
    }

    const tietKhi = getTietKhiForDay(year, month, day) || null;

    const weekday = new Date(year, month - 1, day).getDay();
    const now = new Date();
    const isToday = (day === now.getDate() && month === now.getMonth()+1 && year === now.getFullYear());

    let cls = '';
    if (weekday === 0) cls = 'sunday';
    if (weekday === 6) cls = 'saturday';
    if (isToday) cls += ' today';

    const tietKhiTag = tietKhi ? `<span class="day-tietKhi">${tietKhi}</span>` : '';
    const safeCC = s => s.replace(/'/g,"&#39;");

    return `<td class="${cls.trim()}" onclick="showDayDetail(${year},${month},${day},'${safeCC(lunarDay)}','${safeCC(canChiDay)}','${safeCC(canChiMonth)}','${safeCC(canChiYear)}')">
        <div class="day-cell-inner">
            <span class="day-solar">${day}</span>
            <span class="day-lunar">${lunarDisp}</span>
            ${tietKhiTag}
        </div>
    </td>`;
}

function showDayDetail(year, month, day, lunarDay, canChiDay, canChiMonth, canChiYear) {
    const weekdays = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
    const wd = weekdays[new Date(year, month-1, day).getDay()];
    const pad = n => String(n).padStart(2,'0');
    const tietKhiExact = getTietKhiForDay(year, month, day);

    // Tiết Khí lúc 12:00 trưa ngày này (đại diện) — nếu ngày này có giao Tiết
    // thì sẽ có transition riêng hiển thị bên dưới.
    const tietNoon = getTietKhiThangNam(ictInstant(year, month, day, 12, 0));
    const transition = getTietTransitionOnDay(year, month, day);

    let tietBlock = '<p class="empty-note">Ngoài phạm vi dữ liệu Tiết Khí (2023–2046).</p>';
    if (tietNoon) {
        tietBlock = `
            <div class="detail-grid">
                <span class="lbl">Can Chi Ngày</span><span class="val canchi">${canChiDay}</span>
                <span class="lbl">Can Chi Tháng</span><span class="val canchi">${tietNoon.thangCanChi.text}</span>
                <span class="lbl">Can Chi Năm</span><span class="val canchi">${tietNoon.namCanChi.text}</span>
                <span class="lbl">Tiết hiện hành</span><span class="val tietKhi-val">${tietNoon.tietHienHanh}</span>
            </div>`;
    }

    let transitionBlock = '';
    if (transition) {
        transitionBlock = `<div class="transition-note">
            🔀 <b>Ngày giao Tiết "${transition.tietTen}"</b> lúc ${transition.gioGiao} (ICT).<br>
            Trước ${transition.gioGiao}: tháng <b>${transition.thangTruoc}</b>, năm <b>${transition.namTruoc}</b>.<br>
            Từ ${transition.gioGiao} trở đi: tháng <b>${transition.thangSau}</b>, năm <b>${transition.namSau}</b>${transition.doiNam ? ' <b>(sang năm Can Chi mới)</b>' : ''}.
        </div>`;
    }

    document.getElementById('modal-detail-content').innerHTML = `
        <div class="detail-date-badge">
            ${day}
            <small>${wd}, ${pad(day)}/${pad(month)}/${year}</small>
        </div>

        <div class="detail-section-label soc">🌙 Lịch Sóc Vọng (mặc định)</div>
        <div class="detail-grid">
            <span class="lbl">Âm lịch</span><span class="val highlight">${lunarDay}</span>
            <span class="lbl">Can Chi Ngày</span><span class="val canchi">${canChiDay}</span>
            <span class="lbl">Can Chi Tháng</span><span class="val canchi">${canChiMonth}</span>
            <span class="lbl">Can Chi Năm</span><span class="val canchi">${canChiYear}</span>
            <span class="lbl">Tiết khí (nếu rơi đúng ngày)</span>
            <span class="val ${tietKhiExact ? 'tietKhi-val' : ''}">${tietKhiExact || '— không có'}</span>
        </div>

        <div class="detail-section-label tiet">☀️ Lịch Tiết Khí (Nguyệt Lệnh thật, tính lúc 12:00 trưa)</div>
        ${tietBlock}

}

// =========================================================
//  THIÊN XÁ
// =========================================================
function getSeason(lunarMonth) {
    if ([1,2,3].includes(lunarMonth)) return 'Xuân';
    if ([4,5,6].includes(lunarMonth)) return 'Hạ';
    if ([7,8,9].includes(lunarMonth)) return 'Thu';
    if ([10,11,12].includes(lunarMonth)) return 'Đông';
    return null;
}
function isThienXaDay(canChiDay, season) {
    const rules = { Xuân:'Mậu Dần', Hạ:'Giáp Ngọ', Thu:'Mậu Thân', Đông:'Giáp Tý' };
    return canChiDay === rules[season];
}
function findThienXaDays(year, month) {
    const days = [];
    const daysInMonth = new Date(year, month, 0).getDate();
    const pad = n => String(n).padStart(2,'0');
    for (let d = 1; d <= daysInMonth; d++) {
        try {
            const sd = new LunarDateLib.SolarDate({ day:d, month, year });
            const ld = sd.toLunarDate();
            ld.init();
            const season = getSeason(ld.month);
            const cc = ld.getDayName();
            if (season && isThienXaDay(cc, season)) {
                days.push({ solar:`${pad(d)}/${pad(month)}/${year}`, lunar:`${pad(ld.day)}/${pad(ld.month)}${ld.leap ? ' nhuận' : ''}`, canChi: cc, season });
            }
        } catch(e) {}
    }
    return days;
}
function displayThienXaDays(year, month) {
    const el = document.getElementById('thienXaDaysList');
    const txDays = findThienXaDays(year, month);
    if (txDays.length === 0) { el.innerHTML = '<p class="empty-note">Không có ngày Thiên Xá trong tháng này.</p>'; return; }
    el.innerHTML = txDays.map(tx => `
        <div class="thienxa-item">
            <div class="tx-date">✨ ${tx.solar} — ${tx.season}</div>
            <div class="tx-detail">Âm: ${tx.lunar} · Can Chi: ${tx.canChi}</div>
        </div>`).join('');
}

function calculateDate() {
    const day = parseInt(document.getElementById('startDay').value);
    const mon = parseInt(document.getElementById('startMonth').value);
    const yr  = parseInt(document.getElementById('startYear').value);
    const n   = parseInt(document.getElementById('numDays').value);
    const res = document.getElementById('calcResult');
    if ([day,mon,yr,n].some(isNaN)) { res.className='calc-result err'; res.innerHTML='Vui lòng nhập đầy đủ thông tin hợp lệ.'; return; }
    const start = new Date(yr, mon-1, day);
    const result = new Date(start.getTime() + n * 86400000);
    const pad = x => String(x).padStart(2,'0');
    const fmtIn = `${pad(day)}.${pad(mon)}.${yr}`;
    const fmtOut = `${pad(result.getDate())}.${pad(result.getMonth()+1)}.${result.getFullYear()}`;
    const dir = n >= 0 ? `đếm tới ${Math.abs(n)} ngày` : `đếm lùi ${Math.abs(n)} ngày`;
    res.className = 'calc-result ok';
    res.innerHTML = `Từ <span class="highlight-date">${fmtIn}</span> ${dir} → <span class="highlight-date">${fmtOut}</span>`;
}
function calculateDaysBetween() {
    const d1=parseInt(document.getElementById('date1Day').value), m1=parseInt(document.getElementById('date1Month').value), y1=parseInt(document.getElementById('date1Year').value);
    const d2=parseInt(document.getElementById('date2Day').value), m2=parseInt(document.getElementById('date2Month').value), y2=parseInt(document.getElementById('date2Year').value);
    const res = document.getElementById('findResult');
    if ([d1,m1,y1,d2,m2,y2].some(isNaN)) { res.className='calc-result err'; res.innerHTML='Vui lòng nhập đầy đủ thông tin hợp lệ.'; return; }
    const pad = x => String(x).padStart(2,'0');
    const date1 = new Date(y1,m1-1,d1), date2 = new Date(y2,m2-1,d2);
    const diff = Math.floor(Math.abs(date2-date1)/86400000);
    res.className = 'calc-result ok';
    res.innerHTML = `Giữa <span class="highlight-date">${pad(d1)}.${pad(m1)}.${y1}</span> và <span class="highlight-date">${pad(d2)}.${pad(m2)}.${y2}</span> là <strong>${diff}</strong> ngày.`;
}

    const input = document.getElementById('tkYearInput');
    input.value = presetYear || currentRealYear();
    renderTietKhiYear();
}
function renderTietKhiYear() {
    const year = parseInt(document.getElementById('tkYearInput').value);
    const content = document.getElementById('tkYearContent');
    if (isNaN(year)) { content.innerHTML = '<p class="tietKhi-unavail">Nhập năm hợp lệ.</p>'; return; }
    if (!solarTermsDB[year]) {
        content.innerHTML = `<p class="tietKhi-unavail">Chưa có dữ liệu Tiết Khí cho năm ${year}. Dữ liệu có sẵn: 2023–2046.</p>`;
        return;
    }
    const seasons = [
        { label:'Mùa Xuân (Th.1–3)', months:[1,2,3] },
        { label:'Mùa Hạ (Th.4–6)',   months:[4,5,6] },
        { label:'Mùa Thu (Th.7–9)',  months:[7,8,9] },
        { label:'Mùa Đông (Th.10–12)', months:[10,11,12] }
    ];
    const pad = n => String(n).padStart(2,'0');
    let html = `<div class="detail-section-label tiet" style="margin-top:4px">Tiết Khí năm ${year}</div>`;
    seasons.forEach(s => {
        const items = [];
        s.months.forEach(m => {
            (solarTermsDB[year][m] || []).forEach(t => {
                items.push(`<li><span class="yr-name">${t.name}</span><span class="yr-time">${pad(t.day)}/${pad(m)}/${year} — ${t.time}</span></li>`);
            });
        });
        if (items.length) {
            html += `<div class="year-ref-season"><h5>${s.label}</h5><ul class="year-ref-list">${items.join('')}</ul></div>`;
        }
    });
    content.innerHTML = html;
}

// =========================================================
//  INIT
// =========================================================
(function init() {
    const now = new Date();
    document.getElementById('month').value = now.getMonth() + 1;
    document.getElementById('year').value  = now.getFullYear();
    renderNowBanner();
    generateCalendar();
    setInterval(renderNowBanner, 60000);
})();
</script>
