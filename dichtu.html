64 QUẺ DỊCH — DỊCH TỰ BẢN NGHĨA

CUNG CÀN

1. THUẦN CÀN :
CÀN thượng - CÀN hạ
**Cách :** “Khốn long đắc thuỷ” (Rồng nơi khô gặp nước). Chỉ tốt cho bậc đại nhân, quân tử (tư duy cao, đức lớn).

**Tượng :** “Thiên hành kiện” (Mặt trời đi rất mạnh). Tượng của sự lớn mạnh. Dự trữ năng lương lớn (khi công việc đang dừng lại). Cỗ máy sẽ chạy nhanh không có vật cản.

**Nghĩa :**
• Sức mạnh, cứng rắn.
• Thẳng thắn, tròn trĩnh (việc chân chính, trung chính mới tốt).
• Quân tử, trong sáng, đẹp đẽ.
• Sự chỉ huy, thống lĩnh, đứng đầu (Càn là Thiên khôi chủ người đứng đầu, nếu tai nạn thì bị thương ở đầu…).
• Thịnh vượng, danh lợi, địa vị (xem làm ăn tốt).
• Thời vận hanh thông (đại nhân hay đại sự).
• Gãy đổ, tán phát, thọ thương, thảm bại (khi xem tiểu sự (những việc nhỏ) như mua xe máy chẳng hạn có khi còn gây tai nạn; xem những việc cạnh tranh đấu đá (chỉ gặp Bĩ mới được việc).
• Càn còn là rồng, ngựa, vàng bạc, màu đỏ, vòng tròn, cái áo, kinh đô, cái đầu, trái cây.

2. THIÊN PHONG CẤU :
CÀN thượng - TỐN hạ
**Dịch tự :** có hình vén quần áo.

**Cách :** “Tha hương ngộ hữu” (Đi xa quê mà gặp bạn). Không đẹp nhưng có may về sau (do bất ngờ vô tình mà gặp). Ngộ: là mức độ cao của hiểu biết (Biết • Hiểu • Thông biến • Ngộ).

**Tượng :** “Thiên hạ hữu phong” (dưới trời có gió).

**Nghĩa :**
• Cấu là ngộ: ngẫu nhiên mà gặp gỡ, gặp thời tới (bản thân chưa đủ độ để có, nhưng bất ngờ mà có, chẳng may mà có).
• Cấu kết, công ty (còn có nghĩa là âm mưu, nếu kiện tụng là đối phương đang cấu kết có âm mưu, nếu lập công ty là được).
• Giao cấu (không chính phối như quẻ Hằng vì 1 âm dưới 5 dương, là cấu dâm tà, không chính giao, quẻ hay ứng với nghĩa giao cấu này).
• Rạn nứt, thoái hoá (Thuần Càn đứt một nét đáy; quan hệ vợ chồng dễ xảy ra rạn nứt, sinh chuyện).
• Sự đè nén, trù úm, ức hiếp, định kiến (Ngũ linh đời người: là người có tài nhưng không được dùng, bị đè nén, khuyết hãm trong công việc gia đình hay cuộc sống) (Cấu 5 dương đè nén một hào âm).
• Tâm linh (Ngộ), đạo của thái cực sinh lưỡng nghi, của âm dương tiêu trưởng (Tượng Thái dương và Thiếu âm, hào âm là hào yếm thế, chịu đựng; Ngũ linh đời người: giỏi độn số, bói toán, dịch học).
• Tiểu nhân, nguỵ quân tử (một phần âm lớn dần lên lấn phần dương, câu kết nhen nhóm, không thật lòng, rạn nứt từ bên trong).

3. THIÊN SƠN ĐỘN :
CÀN thượng - CẤN hạ
**Dịch tự:** có hình như người ngồi trên ghế, bị rút một chân ghế → Bị hất cẳng, về vườn.

**Cách :** “Nùng vân tế nhật” (Mây đen che kín mặt trời). Bắt đầu rơi vào tình trạng bị đè nén, mất tác dụng, phải rút lui, tốt nhất nên lui về. (Ánh sáng: trí tuệ, thần phúc).

**Tượng quẻ :** “Thiên hạ hữu sơn” (Dưới trời có núi). Mặt trời khuất núi → Độn, xế chiều, hoàng hôn.

**Nghĩa :**
• Thoái lui, ở ẩn (quan chức sẽ mất chức, về hưu, bị điều chuyển có khi lên trên nhưng không thực quyền…).
• Trốn chạy, che dấu, không xuất đầu lộ diện, ẩn trốn, nằm im chờ thời, dự trữ thế năng…
• Lãng quên, bưng bít (nếu đi tìm hiểu thông tin sẽ không biết được vì bị che dấu, bưng bít, che mắt).
• Sự sáng cuối cùng, rực rỡ để tàn, bùng sáng (có thể được thêm một phần của nhiệm kỳ nữa, nếu bệnh tật có thể sống thêm một thời gian nữa).
• Ghế của lãnh đạo, sự ngưng chỉ, tĩnh tại, kiên trì, sự ngồi lại (mất chân ghế nhưng không ngã, gượng ngồi lại), kéo dài thời gian nữa (xin việc có thể bị dây dưa kéo dài, nếu được ngay phải là quẻ Dự).
• Sự che dấu tài năng, co lại, đợi thời bung ra (Ngũ linh đời người: có tài không biểu hiện ra. Như người cao tuổi, điềm đạm, kinh nghiệm).
• Độn là hưởng lạc, là ngũ độn (chìm đắm trong 5 loại hưởng lạc) mà quên đi bản tính:
  • Chìm đắm trong Kim thì mê vật dụng.
  • Chìm đắm trong Mộc thì mê cung điện.
  • Chìm đắm trong Thuỷ thì mê du thuyền.
  • Chìm đắm trong Hoả thì mê sơn hào hải vị, nấu nướng cầu kỳ.
  • Chìm đắm trong Thổ thì mê lâu đài nguy nga.
  • Đây là năm căn bệnh trầm kha của con người.

4. THIÊN ĐỊA BĨ :
CÀN thượng - KHÔN hạ
**Cách :** “Hổ lạc hàm khanh” (Hổ sa xuống hố). Khanh: hầm, hố. Như người gặp nạn. “Bĩ thái cùng thông”.

**Tượng :**
• “Thiên địa bất giao” (Càn là trời, tượng khí nóng ở trên bốc lên; Khôn là địa khí lạnh bên dưới chìm xuống → không có sự giao hoà).
• “Thiên hành địa thượng” (Mặt trời đi trên đất) → tượng của bình minh; thời của sự khởi đầu (nếu xem những việc đang ở thời kỳ đầu tiên là tốt, nếu ở tầm cuối của sự việc là bế tắc).

**Nghĩa :**
• Bĩ là mặt mới ló ra trên mặt đất, mặt trời mọc buổi sáng (Bình minh).
• Bế : bế tắc, bí.
• Bất giao hoà, Âm Dương cách trở, bất lợi (Hôn nhân xem gặp Bĩ thì không tốt, tượng cha mẹ già phối → không sinh nở được; nếu mới tìm hiểu xem gặp quẻ Bĩ thì tốt, sẽ phát triển vì là quẻ lục hợp tượng trưng sự gắn bó; bệnh tật gặp Bĩ thì dễ chết).
• Sự lôi kéo (“Bạch thư chu dịch”), thuyết khách, giao hoà không chính thức, (nếu xem con cái đi đâu thì hay biểu hiện là bạn bè lôi kéo, thường là bạn gái vì có Thê tài trì thế).
• Bĩ có nghĩa là tiểu (nhỏ). Những việc nhỏ (tiểu sự) thì thành, việc lớn (đại sự) thì hung, tiểu nhân đắc lợi, đại nhân thì tổn hại, không hợp với hàng quan chức.
• Lợi khởi sự, khởi đầu mà không lợi về sau (hôn nhân là đại sự mà cần lâu bền nên gặp Bĩ là không tốt).
• Tượng người nông dân, tầng lớp thấp (áo vải cờ đào).
• Người ngồi xổm, người đi ngoài bị táo nhiệt (vì Bĩ có nghĩa là bế, vón lại).

5. PHONG ĐỊA QUAN :
TỐN thượng - KHÔN hạ
**Dịch tự:** Như người đang đứng vỗ tay, cổ động, thầy dùi.

**Cách :** “Hạn bồng phùng hà” (Bèo hạn gặp nước).

**Tượng :** “Phong hành địa thượng” (Gió thổi trên mặt đất). Mọi thứ như gió thổi, không sâu sắc, hời hợt, nhìn ngó hơn làm. Hay gặp may nhỏ (khác với quẻ Cách thành công do bản chất, tài năng mà có).

**Nghĩa :**
• Quan sát xem xét.
• Chiêm ngưỡng, biểu hiện của người ngoài cuộc đứng nhìn (khi xem việc gặp quẻ Quan thì cần phải có người ngoài giúp sức).
• Quan ngoại (bên ngoài), đặt ra ngoài. Sự trợ giúp của người thứ ba, bên ngoài mới được việc (Tìm người đỡ đầu sẽ được việc).
• Sự xa cách, sự đi lại, Dịch mã, xuất ngoại (Ví dụ có người xem có đi nước ngoài được không gặp quẻ Quan thì đi được, nhưng nên có người ngoài tác động giúp).
• Sự lộn ngược phải trái, đảo lộn thắng thua (kiện tụng thì đến lúc cuối sự việc đảo lộn thắng thua) → không rõ ràng.
• Quan chức, quan sự. (Thăng quan, tiến chức).
• Quan quách, quan tài, mồ mả (Tốn mộc là áo quan, ở trên Khôn là đất, vì Khôn là đất đào lỗ để chôn khác với Cấn là đất bằng; hay Khôn là cỗ xe trâu, bò, Tốn mộc là gỗ, tức xe chở quan tài; Nếu xem bệnh tật thì không tốt). Tượng người tay bắt chuồn chuồn (sắp chết).
• Quan là Quán : người thông minh, hiểu biết, quán thông nhưng láu cá, quán xuyến.
• Môn quan (cái cổng, cửa ngõ, cửa khẩu, cửa nhà) (Khác với Bác là ngôi nhà).
• Tượng người đi cà kheo (khác quẻ Bác là người làm xiếc đi trên dây; việc đại sự gặp Bác là đổ vỡ, gặp quẻ Quan thì cuối cùng sẽ thống nhất).

6. SƠN ĐỊA BÁC :
CẤN thượng - KHÔN hạ
**Cách :** “Ưng thước đồng lâm” (chim ưng và chim khách ở cùng một rừng, sự tranh đoạt hoặc mất hoặc được).

**Tượng :** “Sơn phụ ư địa” (núi tựa vào đất, núi cao vực thẳm). Sự chông chênh, nguy hiểm.

**Nghĩa :**
• Bác là lạc, rơi rụng, rớt, đổ bể.
• Bác là bóc, là xé ra, bỏ đi, loại đi, là hỏng, là trượt.
• Bác là sai lệch, sai địa chỉ (gửi trứng cho ác) (Ví dụ định nhờ cậy việc gì gặp quẻ Bác thì bị lừa, nhờ không đúng chỗ).
• Đổ bác (cờ bạc). Mệnh gặp quẻ Bác là ham mê cờ bạc.
• Cái nhà (nhà lá, nhà cấp 4, hay là nhà xấu, nghèo, bừa bộn).
• Người làm xiếc trên dây (phiêu lưu mạo hiểm, dễ ngã gẫy cổ).
• Việc đại sự gặp Bác dễ đổ vỡ, hoặc thắng lớn, hoặc mất cả (bóc bằng hết).

7. HỎA ĐỊA TẤN :
LY thượng - KHÔN hạ
**Cách :** “Sừ địa đắc kim” (Cày, bừa đất được vàng). Đắc lợi trong tương lai gần.

**Tượng :**
• “Minh xuất địa thượng” (Ánh sáng trên mặt đất).
• “Nhật lệ trung thiên” (Mặt trời trên đỉnh đầu).
• Thời giữa sự kiện, đang sung sức, sẽ thành công. Bệnh tật gặp quẻ Tấn là lúc cực xấu.

**Nghĩa :**
• Tiến, tiến thịnh, phát triển thuận lợi, lên cao.
• Sáng tỏ, rõ ràng (mặt trời giữa trưa).
• Đi mạnh, phát triển mạnh. (Có thông tin rõ ràng).
• Hoà thuận (nhún nhường thuận theo (của Khôn) mà vui vẻ (của Ly).
• Phụ tử đồng chiều (“Bạch thư chu dịch”) (Phụ ở đây là mẹ, Khôn là mẹ đang đỡ con là Ly). (Sinh đẻ gặp là tốt, nếu động hào 5 là đẻ nhanh, dễ, nếu sinh con đầu là con trai, nếu sinh lần thứ hai thì đứa trước là trai đứa sau là gái, đứa trước là gái đứa sau là trai).

8. HỎA THIÊN ĐẠI HỮU :
LY thượng - CÀN hạ
**Cách :** “Khuyển mộc hô tước” (Chặt cây bắt thêm được tổ chim tước). Quẻ đẹp nhất trong 64 quẻ (như sao Hoá lộc trong môn Tử vi: lộc trời cho).

**Tượng :** “Hoả tai thiên tượng” (Trên trời có lửa cháy sáng rực). Ly là ánh sáng của mặt trời, Càn là bầu trời.

**Nghĩa :**
• Có, cả có, có lớn (hỏi có được hay không: có).
• Thịnh vượng, giàu có lớn, đại phú (cầu tài là nhất, có cả bầu trời).
• Sở hữu, được lợi.
• Lưỡng lợi (2 lần được lợi).
• Khoan hòa, rộng lớn, bao dung.
• Chiến tranh lớn (xung đột giữa các quốc gia, khu vực, thế giới) hay là hoả tai.
• “Thuỷ hoả đạo tặc”: cháy nhà (ví dụ đi quên tắt bếp về cháy bếp).

CUNG KHẢM
KHẢM thượng - KHẢM hạ
9. THUẦN KHẢM :
**Cách :** “Hải để lao nguyệt” (Mò trăng đáy biển). Trăm sự đều hỏng (Hai lần hãm hiểm). Quẻ lục xung. (Ngoài mềm trong cứng: đủ trí tuệ, tư duy.)

**Tượng :** “Thuỷ tấn chí” (các dòng nước đều tiến đến).

**Nghĩa :**
• Hãm hiểm, gian nan, mắc kẹt.
• Ngoắt ngoéo, không thành công (Ví dụ: nhờ người việc gì thì mất tiền, mất thời gian, không thành).
• Nhầm lẫn, nhầm tưởng, mơ hồ, bị lừa dối (nếu xem việc mất đồ thì không mất, do nhầm lẫn để ở đâu đó, thường là gầm tủ, chân giường, gầm giường. Quẻ ngang hoà không mất).
• Bế tắc (như tắc đường tưởng đi được nhưng càng đi càng tắc, muốn quay lại không được). Đang làm nên bỏ luôn, cứ cố đâm lao phải theo lao thì khó rút ra được.
• Trí tuệ, tinh nhanh, tỉnh táo (giỏi nhiều lĩnh vực, ngoắt ngoéo nhưng đàng hoàng phù hợp với vai trò của mưu sĩ; thuỷ tuộc trí).
• Ngoài nhu trong cương, không thật, lừa dối.
• Khảm là lõm, là hai lần mắc hiểm (có hai hào dương ở giữa là tùng hiểm). Khảm là ô tô.

**Ghi chú sơ đồ (ý nghĩa vị trí hào của quẻ Khảm) :**
• Hào dương ở trên tượng “đậu” (đỗ, dừng).
• Hào dương ở giữa là “hãm”.
• Hào dương ở dưới là “động”.
• Hào âm ở trên là “đẹp lòng”.
• Hào âm ở giữa là “mắc” (lệ thuộc).
• Hào âm ở dưới là “nhún nhường”.

10. THUỶ TRẠCH TIẾT :
KHẢM thượng - ĐOÀI hạ
**Cách:** “Trảm tướng phong thần” (Chém tướng phong thần). Đến phút cuối cùng mới thành công.

**Tượng :** “Trạch thượng hữu thuỷ” (Nước trên mặt đầm).

**Nghĩa :**
• Ngưng chỉ, chỉ, đình chỉ, tiết độ, tiết chế, điều tiết.
• Ngưỡng, giới hạn, tới hạn, tới độ, ngưỡng sai biệt (nếu rơi vào thời cuối cùng của sự việc mới có giá trị).
• Tận thành, là sự việc đến tận cuối cùng mới thành, “Vật cùng tắc biến”. Hiện thời vận chưa đến, còn khó khăn, cứ kiên trì hành động theo chương trình kế hoạch mục tiêu đặt ra thì tất thành công.
• Đốt, mắt, mấu, mắt xích, từng đoạn, từng phần liên tiếp (sẽ mắc ở một khâu hay giai đoạn nào đó tận cùng mới thành công). (Ví dụ: đi đón dâu thì dễ vướng mắc ở giai đoạn đầu như xe không đến, đến sai hẹn… làm lỡ kế hoạch.)
**Ghi chú sơ đồ:** quẻ đại Ly, là “mắc”, lệ thuộc.
11. THỦY LÔI TRUÂN :
KHẢM thượng - CHẤN hạ
**Dịch tự :** có hình như anh bồi bàn bưng đĩa chạy.

**Cách :** “Loan ti vô đầu” (Rối như tơ vò).

**Tượng :**
• “Vân lôi truân” (Mây trên sấm dưới).
• “Mật vân bất vũ” (Trên mây dày mà không mưa được). Khí tiết mùa hè oi bức không mưa, không có gió. Có mưa mới giải thoát được.

**Nghĩa :**
• Rối ren, gian truân, gian khổ, khó khăn.
• Đầy tắc, uất kết chưa thông (ví như trời nhiều mây sấm dậy nhưng mưa lại chưa xuất hiện, đến cùng cực của sự oi ả, sự uất tắc của thời tiết).
• “Nạn sinh” tức chuẩn bị sinh nở, phút cuối trước khi sinh (Chấn: động, ở trong chỗ hiểm: Khảm, nạn sẽ qua nếu là “nạn sinh” tức cái khổ, cái gian nan của sự vật sắp sinh ra ví như sự sinh nở vậy).
• Nghĩa của dịch thì Âm dương mới giao, mây sấm ứng nhau chưa thành nên là Truân. Nếu đã thành mưa thì là Giải. Âm dương không giao hoà là Bĩ. Mới giao nhau mà chưa xuống thì là Truân.
• *Truân*: khó khăn, gian nan ở hai đầu mút, của bước đầu công việc, kết thúc công việc.
• *Khốn*: Khó khăn, gian nan của quá trình, đều đều thành thường.

**Ghi chú sơ đồ — giai đoạn phát triển :**
• *Bĩ*: Chớm có thai, chưa thành hình thể.
• *Truân*: Quá trình mang thai.
• *Giải*: Đã sinh xong.

12. THỦY HOẢ KÝ TẾ :
KHẢM thượng - LY hạ
**Cách :** “Kim bảng đề danh” (Bảng vàng đề tên). Thi cử, việc có sự lựa chọn đều hanh thông.

**Tượng :** “Thuỷ tại hoả thượng” (Nước ở trên, lửa ở dưới tượng của việc đã xong).

**Nghĩa :**
• Ký tế là đã thành, đã xong, đã đủ cả.
  • Hào 1 : Dương cứng rắn, khởi đầu quyết đoán có cơ hội thành công (đúng vị).
  • Hào 2 : Âm, quẻ nội đại diện quần chúng nhân dân mềm mỏng phù hợp (âm nhu), nghệ thuật đắc nhân tâm, thuận mọi người mới theo (đắc trung đắc chính).
• Đã đi qua, đã sang bờ. (Ly : xe máy, Khảm: ô tô. Nếu hào 4 động là lo lắng: tai nạn xe máy, tai nạn ô tô vì Thuỷ khắc hoả. Hào 6 là đã đi qua).
• Sự hoà hợp (như nước lửa giao nhau); Xem hôn nhân thì tốt, âm dương giao hoà, anh em hoà thuận, huynh đệ giúp đỡ lẫn nhau.
• Ký tế là thi đỗ, khoa bảng. (Hành hỏa tượng của văn chương).
• Sơ cát, chung loạn tức là ban đầu khởi sự tốt đẹp, nhưng kết cục lại rối loạn, bất thuận ( nếu việc đã hoàn thành gặp Ký tế thì xấu ).

13. TRẠCH HỎA CÁCH :
ĐOÀI thượng - LY hạ
**Cách :** “Hạn miêu đắc vũ” (Hạn lâu gặp mưa).

**Tượng :** “Trạch trung hữu hỏa ” (Giữa đầm có lửa). Trong chứa đựng sức mạnh mãnh liệt.

**Nghĩa :**
• Cách nghĩa là cải, cải đổi, cải cách, thay cũ đổi mới (canh cải). (Tử vi là người có Thiên lương đóng Mệnh cung). Làm nhà được quẻ Cách: một thời gian đổi nhà, xin việc thì được (thay cũ đổi mới).
• Cách là cách mạng (thay đổi mới, đột biến theo chiều hướng tốt đẹp. Quẻ Hoán là thay đổi vị trí).
• Đại sự, việc quan trọng (tiểu sự được quẻ Cách là hỏng việc).
• Lính chiến, quân đội, tù ngục (mệnh tàng chứa sự hung hoạ, tù ngục (tù chính trị)).
• Văn minh, sáng đẹp (Ly là nhật 日, Đoài là nguyệt 月, thành 明命 (Minh mệnh) (ngược lại Hỏa Trạch Khuê là chia tay).
  • *Quẻ Cách* : nói giỏi, nhưng ít nói (vì nói mà hợp nhau).
  • *Quẻ Khuê* : hay nói nhưng nói chuyện nhỏ nhặt (vì nói mà xa nhau).
  • (Cách có hình dạng : quyền cao, trán cao, thường là đàn ông).
• Cách là lịch pháp, quy luật vận động của tự nhiên, của nhật nguyệt (vì Đoài là tượng mặt trăng khuyết, Ly là mặt trời, là nhật. Cách là chữ nhật 日, bên chữ nguyệt 月, thành 明 là sáng vậy).
• Cách là cái lò ( hỏa lò) : hào 1 là đáy lò, hào 2 là cửa lò, hào 3, 4, 5 là lưng lò, hào 6 là miệng lò.
• Cách là sự sinh đẻ (bản chất gốc của quẻ Cách). Sinh sản tốt, mẹ tròn con vuông.

14. LÔI HỎA PHONG :
CHẤN thượng - LY hạ
**Cách :** “Cổ kính trùng minh” (Lau lại cái gương cũ).

**Tượng :** “Lôi điện giai chí” (Sấm chớp đều đến). Nội là gần, ngoại là xa : Ly là chớp nhìn thấy trước, Chấn là sấm nghe thấy sau.

**Nghĩa :**
• Phong là mãn, phong mãn, phong phú, lớn đầy, thịnh vượng.
• Phong là phục, phục hồi, phục chức, làm cho sáng lại (khác với quẻ Phục là ẩn dấu, nằm phục chờ đợi). Vì vậy bảo là “Cổ kính trùng minh”.
• Phong là tàng, phong tàng, che đậy, dán kín (tàng là khép, dán lại, không thích nói ra, kín đáo nhưng không phải lừa dối).
• Phong tặng, phong chức tước, phong thưởng (tượng của huân huy chương mộc ở trên hình chữ nhật, hoả ở dưới hình sao nhiều cánh).
• Phong là được yết kiến đại nhân, quyền quý. “Phong vi cửu điện” (Sấm chớp, ánh sáng, ban bố mệnh lệnh).

15. ĐỊA HỎA MINH DI :
KHÔN thượng - LY hạ
**Cách :** “Quá hà chiết kiều” (qua sông phá cầu; qua cầu rút ván).

**Tượng :** “Minh nhập địa trung” (Mặt trời lặn vào trong đất). Ánh sáng lộ ra là có phúc, ánh sáng mất là hoạ.

**Nghĩa :**
• Minh Di là sự thương tổn, thiệt hại đau đớn (thời cực bĩ). Xuất hành: gặp tai nạn. Xin việc: có sự thương tổn.
• Minh Di là tối tăm, ánh sáng bị che lấp (Ngược lại với quẻ Tấn). Kiện cáo: bị thế lực nào đó che lấp hết.
• Là tù ngục, giam hãm, hình phạt, gông cùm (Tù hình sự thường: trộm cắp…). Quẻ có tượng của cửa sổ, song sắt nhà tù. (Bản mệnh Minh Di: giống cách Liêm Tham Tỵ Hợi, thông minh, trẻ hay bị cô giáo ghét vì nghịch trong lớp mặt tỉnh bơ: ánh sáng bị che khuất).
• Minh Di là diệt, tiêu diệt, di dập (như di dưới chân), trù úm, là dùng nhưng không dụng.
• Minh Di là đội nạn lớn. (Nữ nhỏ lệ, nam tội nạn lớn, đời sống thì tối tăm, tù ngục thương tổn).
• Minh Di là thuỳ châu nhỏ lệ (theo “Bạch thư Chu Dịch”), là tượng người Phụ nữ khóc tại mộ chí. Nếu quẻ Ngũ linh đời người mà con gái mệnh quẻ Minh Di sinh năm, tháng ngày Giáp chỉ luôn khóc chồng con (ngày Giáp Dần càng chính xác).
• Minh Di tượng người phụ nữ không xinh đẹp, lưỡng quyền hơi cao, sức khỏe không tốt lắm, miệng hơi vẩu, nói xít răng, ham tình dục (hấp tinh khí của nam giới).

**Ghi chú sơ đồ :** Nước mắt ướt đất (nước trong đất). Khôn là Đất. Nước trong đất.

16. ĐỊA THỦY SƯ :
KHÔN thượng - KHẢM hạ
**Cách :** “Mã đáo thành công” (Thành công trở về).

**Tượng :** “Địa trung hữu thuỷ” (Trong đất có nước). Khôn được thêm một hào âm dầy lên, Khôn là khí của đất nên đất được thêm khí.

**Ghi chú sơ đồ :** Khôn là Đất; Nước trong đất.

**Nghĩa :**
• Sư là chúng, quần chúng, đám đông, nhiều người tụ tập.
• Sư là quân đội, quân sự, tướng lĩnh.
• Sư là thầy giáo, giáo sư, gia sư, nhà sư.
• Sư là luật, đạo luật, quân luật (thể hiện việc thi hành luật là chính, không phải việc ban hành luật). “Sư dĩ luật”.
• Sư là đạo của người cầm quân, đạo của sự chính đính, bậc lão thành (trung chính, đàng hoàng). Dùng người có tuổi, bậc lão thành dày dạn kinh nghiệm mới được việc.
• Sư là sự bắt chước, làm theo (sáng tạo tất chuốc tai họa).
• Sư là tù ngục, quân pháp, án lệnh (thường là quân nhân phạm tội).

•••

CUNG CẤN

17. THUẦN CẤN :
CẤN thượng - CẤN hạ
**Cách :** “Sơn mạch trùng tăng” (Mạch núi trùng điệp). Vướng mắc đầy rẫy cản trở.

**Tượng :** “Kiêm sơn Cấn” (Núi trên núi là Cấn).

**Nghĩa :**
• Cấn là chỉ, ngưng chỉ, đình chỉ, ngăn bước, ngăn cách. (Nếu xuất hành: không đi được...).
• Cấn là trở ngại, khó khăn (đang mưa thì nắng, đang nắng thì mưa, đang khổ sẽ bớt khổ… Xin chuyển công tác không thành).
• Cấn là tù hãm, cấn cáng (tù hãm ở đỉnh cao).
• Cấn là chùa chiền, tu hành, tăng đạo, tượng của nhà sư cầm bát đi khất thực (Mệnh thuần Cấn : đi tu, mũi cao, lưỡng quyền cao).
• Cấn là ngôi Nhân trong Thiên • Địa • Nhân (tam tài).
• Ý nghĩa các hào (theo bộ phận cơ thể):
  • Hào 1: Cấn kỳ chỉ (ngưng ở ngón chân).
  • Hào 2: Cấn kỳ phì (ngưng ở bắp chân).
  • Hào 3: Cấn kỳ hạng (ngưng ở bên hông).
  • Hào 4: Cấn kỳ thân (ngưng ở giữa thân mình: xương sống lưng, thận…).
  • Hào 5: Cấn kỳ phục (ngưng ở mồm mép: tai nạn thì mặt mũi xây xát, cấm khẩu…).
  • Hào 6: Đôn Cấn (sự dày dạn về cách ngăn ngừa) với quẻ Cấn là hào tốt nhất.

18. SƠN HỎA BÍ :
CẤN thượng - LY hạ
**Cách :** “Hỷ khí doanh môn” (Vui vẻ đến tận cửa, trước cửa).

**Tượng :** “Sơn hạ hữu hoả” (Dưới núi có lửa). Ánh sáng chiếu dưới chân núi, rực rỡ rất đẹp.

**Nghĩa :**
• Bí là sức, trang sức, làm đẹp.
• Bí là hình thức, dáng vẻ bên ngoài (Tượng của hai quẻ Ly: đại Ly ở trên và Ly ở dưới là ánh sáng rực rỡ màu mè).
• Bí là sự cầu hôn (nghĩa gốc của quẻ Bí) tượng của trao nhẫn cưới (Quẻ Ly ở dưới là tượng của ngón tay, quẻ ly ở trên tượng của cái nhẫn rỗng ở giữa. Ly cũng là tượng cái miệng nói cười vui vẻ, đám cưới thường là đi ô tô).
• Bí là quần áo, son phấn (thường là y phục phụ nữ, Ly là tượng thỏi son).

**Ghi chú sơ đồ :** Khảm là ô tô.

19. SƠN THIÊN ĐẠI SÚC :
CẤN thượng - CÀN hạ
**Cách :** “Trần thế đắc khai” (Trần thế đã mở). Thời vận đã đến, bắt đầu hanh thông.

**Tượng :** “Thiên tại sơn trung” (Trời ở trong núi). Chỉ sức chứa ghê gớm (trong quẻ chứa quẻ Đại Hữu).

**Nghĩa :**
• Tích chứa, tích trữ, tích tụ, dự trữ (Quá trình học cũng là Đại Súc).
• Súc là tụ, tụ tập, tụ họp (tụ họp ở mức độ lớn, nhóm lớn như đảng phái, khác với tụ của quẻ Tuỵ là ở mức nhóm, bầy nhỏ).
• Tiếp xúc lớn, những vụ giao dịch lớn, giao dịch với đại quý nhân, các bậc quyền quý (kinh doanh rất tốt vì trong quẻ chứa Đại Hữu là thắng lớn).
• Còn gọi là cách “Thuần thu nội liễm” (quẻ nội ở trong là Càn tràn đầy sức mạnh, nhưng không muốn để tràn ra dùng quẻ Cấn cái tĩnh để kiềm chế sức mạnh. Biểu hiện trong mạnh mà ngoài tĩnh). Quẻ này việc đại sự, đại nhân mới thành.
• Đại Súc là co lại, là bệnh co rút khớp xương, bệnh liệt…

20. SƠN TRẠCH TỔN :
CẤN thượng - ĐOÀI hạ
**Dịch tự :** như kẻ nằm gốc cây chờ sung. Kẻ đầu tư thì chờ thời.

**Cách :** “Tổn kỷ lợi nhân” (Tổn mình ích người), biết rằng mình sẽ có lợi sau “Thả con săn sắt bắt con cá rô”.

**Tượng :** “Sơn hạ hữu trạch” (Dưới núi có đầm). Cấn có ba hào, lại thêm một hào âm của quẻ Đoài thành quẻ đại Cấn làm cho núi cao thêm, tức là tổn ta ở quẻ nội, lợi cho quẻ ngoại. Nhưng cũng là tượng rủi ro, không chắc chắn, như người đang dò từng bước trên đường chỉ có thể thấy được ở bên trên, còn dưới có hố lầy cạm bẫy thì không thấy được (Trong kinh doanh chi phí tài chính thì có thể biết được, nhưng không tính được chi phí kinh tế (phần mềm)).

**Ghi chú sơ đồ :** Hoả là công nghệ phần mềm. Kim là công nghệ phần cứng.

**Nghĩa :**
• Tổn là giảm, tổn phí, mất mát, thiếu hụt (nếu cho vay lãi, sau biểu hiện có sự cố, xem được quẻ Tổn là sẽ mất. (tổn trong nội bộ, lợi ở bang giao, nên tổn là tổn hạ ích thượng, tổn dưới mà lợi trên).
• Tổn là đầu tư (mình chịu tổn một chút để làm lợi cho người, tổn mà không mất hẳn có cơ hội lời lại). Làm ăn, đầu tư nếu gặp quẻ Tổn thì nên đầu tư, Tổn là ích.
• Tổn là sự thành tín, điều tiết cân bằng (làm ăn đầu tư phải thành tín, ban đầu phải có niềm tin).
• Tổn là thuế: quẻ nội là dân, quẻ ngoại là nhà nước, bị mất đi một hào âm là dân nộp thuế cho nhà nước. (Nếu quẻ ngũ linh đời người là Tổn thì nên vào các ngành như thuế, tài chính, kho bạc…).

21. HỎA TRẠCH KHUÊ :
LY thượng - ĐOÀI hạ
**Cách :** “Thái công bất ngộ” (Tích Lã Vọng chưa gặp thời, đi câu bằng lưỡi câu thẳng. Chưa gặp thời, chưa đến thời vận). Đoài là tiền vàng (vàng trao đổi không phải vàng tồn trữ). Ly là hoả đốt chảy vàng ra nước: tượng của kinh doanh buôn bán đang ở giai đoạn thua thiệt, hao tổn.

**Tượng :** “Thượng hoả hạ trạch” (Lửa ở trên, đầm ở dưới) là tượng của sự ma quái (lân tinh cháy sáng trên mặt đầm, ma trơi).

**Nghĩa :**
• Khuê là bối (lưng), là phản bối (quay lưng lại với nhau), là trái ngược nhau, là khác nhau (Nếu thành lập công ty xem được quẻ Khuê là không được, xem hôn nhân chưa cưới thì quay lưng lại với nhau, đã lấy nhau thì cãi nhau suốt. Tượng của quẻ là 2 nữ trong một nhà: Đoài Ly, có một người đàn ông: Khảm).
• Khuê là sự nhầm lẫn (trông gà hoá quốc) là khí vận chưa hanh thông, tượng của con số ba (3 người, 3 năm hoặc 3 tháng... mới được).
• Là tiểu hanh thông, là tốt cho tiểu sự, là dạm ngõ ( dạm ngõ thì tốt : Ly là mâm quả, Đoài là cô gái đội mâm. Cưới xin không được. Sao khuê rất sáng nhưng chỉ một lúc sáng hoặc tối ).
• Khuê là lợi ban đầu mà lìa về sau ( tiền cát hậu hung ). Ban đầu bao giờ cũng tốt, như lúc bé hai nữ ở chung một nhà, lớn lên lấy chồng ai về nhà ấy, ý chí khác nhau nên lìa vậy, lìa là cùng gốc mà xa nhau ra.

22. THIÊN TRẠCH LÝ :
CÀN thượng - ĐOÀI hạ
**Cách :** “Phượng minh kỳ sơn” (Chim phượng đến núi Kỳ). Chim phượng hay là kỳ lân đến nơi nào thì nơi ấy xuất hiện thánh nhân, tốt đẹp, gặp điều lành.

**Tượng :** “Thiên thượng hạ trạch” (Trên trời dưới đầm). Mặt trời chiếu trên đầm.

**Nghĩa :**
• Là lễ, lễ lạt, lễ nghĩa, lễ vật, thờ cúng, cúng lễ (là tiểu lễ. Đại lễ là quẻ Tuỵ: dụng đại sinh cát).
• Pháp, pháp lý, pháp luật (đưa vào lề lối). Phải đúng quy trình, trình tự, đúng pháp luật mới tốt.
• Là thiên lý, đi xa.
• Tôn ti, trật tự.
• Bao bọc, che chở, chìm khuất (cương bị chìm trong nhu, Càn cứng bị chìm trong đầm, âm của quẻ Đoài mở ra để đón nhận, như đá ném ao bèo).

23. PHONG TRẠCH TRUNG PHU :
TỐN thượng - ĐOÀI hạ
**Cách :** “Hành tẩu bạt băng” (Đi lại trên băng). Tàng chứa sự hung hoạ, sự mập mờ không chắc chắn, không rõ ràng (hung: là chưa xảy ra, nếu xảy ra rồi là nguy).

**Tượng :** “Trạch thượng hữu phong” (Trên đầm có gió). Biểu hiện sự lệ thuộc (trạng thái chờ đợi, có phản ứng của bên kia mới biết được việc của mình ra sao, phải tin tưởng (tín) mới thành công). Quẻ đại LY chỉ sự bám dính (tồn tại phải bám vào một cái gì đó (khác với Đoài: bám theo chiến lược có bài bản, dùng phép nhu) quẻ này có Tốn nên thực nhu (thực bám).

**Ghi chú sơ đồ (cấu trúc hào) :** Dương cương – Âm nhu – Dương cương.

**Nghĩa :**
• Là tín, tin tưởng, niềm tin (không tín sẽ hỏng việc).
• Chí thành, hoà hoãn, thông thủ (thống nhất ý chí, bao dung).
• Nội hư, ngoại thực, giả dối, lừa dối, dao động, bằng mặt không bằng lòng (người trong cuộc dao động hoặc là cá nhân người xem quẻ dao động).
• Xem được quẻ này ít thành công: Ly trung hư rỗng tuếch, nhờ người khác, có thể không thực quyền.
• Mỏng manh lỏng lẻo.

24. PHONG SƠN TIỆM :
TỐN thượng - CẤN hạ
**Cách :** “Hồng nhạn cao phi” (Chim nhạn sẽ bay cao). Đàng hoàng đứng đắn đang tiến tới, sẽ có công danh sự nghiệp.

**Tượng :** “Sơn thượng hữu mộc” (Trên núi có cây).

**Nghĩa :**
• Tiệm là tiến, tiến lên, vươn lên.
• Tiệm là gần, tiệm cận, tiệm tiến, dần dần, gần tới (thời hạn đã gần tới).
• Tiệm là quá trình, là con chim hồng hạc đang bay cao.
• Hào 1: Hồng tiệm vu can (chim hồng tiến đến mép nước). Đẹp.
• Hào 2: Hồng tiệm vu bàn (bay tới hòn đá bằng như cái bàn “đắc lộc đắc thực”, có sự ăn uống, thời cơ đến). Đẹp.
• Hào 3: Hồng tiệm vu lục (chim hồng bay tới cái gò bằng) → nhìn ngó, quan sát (động hào này biến thành Phong Địa quan). Bình thường.
• Hào 4: Hồng tiệm vu mộc (chim hồng bay lên cây): tưởng như lên cao nhưng là thoái ẩn, rút lui (Động hào này biến Thiên Sơn Độn).
• Hào 5: Hồng tiệm vu lăng (chim hồng lên gò cao): vô tư, vô lo, không nghĩ ngợi gì, làm việc sẽ hỏng, hào 5 quân vương nhưng ở đây chỉ có thể là vua của cái bang (ăn mày) ( Động hào này biến Thuần Cấn : chỉ đi tu là tốt ). Rút lui.
• Hào 6: Hồng tiệm vu quỳ (chim hồng bay bổng lên trên mây) → đi mất hút: xem tin người là mất hút, (mọi việc chỉ tốt khi đang tiến tới nếu đã đến nơi thì hết hay, chán). Rút lui.

•••

CUNG CHẤN

25. THUẦN CHẤN :
CHẤN thượng - CHẤN hạ
**Cách :** “Thiên hạ dương danh” (Vang danh thiên hạ). Trên Chấn dưới là đại Ly: chớp, có tiếng sấm.

**Tượng :** “Tấn lôi” (Sấm dồn). Việc đến nhanh, dồn dập (nếu xem quẻ cho cả năm thì năm đó thành công, dồn dập nhiều việc, liên tục).

**Nghĩa :**
• Chấn động, rung động, phát động, phấn phát.
• Hoảng hốt, kinh hãi, kinh sợ.
• Hanh, hanh thông động mà hanh thông, nhanh chóng (xem việc sinh đẻ gặp Thuần Chấn là ra sao Thiên phụ: quẻ rất tốt).
• Tiền hung hậu cát, trước lo sợ sau vui vẻ.
• Tổn thương chân tay (do quẻ khác biến ra Thuần Chấn thì có nghĩa này, bản thân quẻ Thuần Chấn ít xảy ra).
• Lộn ngược đầu đuôi, trồng cây chuối. ( Nó ngược lại với quẻ Cấn ).

26. LÔI ĐỊA DỰ :
CHẤN thượng - KHÔN hạ
**Cách :** “Thanh long đắc vị” (Rồng xanh đứng đúng vị). Vui vẻ hoà đồng, quần chúng.

**Tượng :** “Lôi xuất địa phấn” (Sấm động đất chuyển) → ào ạt, tính cách mạnh, không chấp nhặt, xông xênh.

**Nghĩa :**
• Dự là duyệt, vui vẻ, hoà vui (vui của hòa đồng, thích đám đông) “thuận dĩ động dự” (thuận theo, động theo mà thành vui).
• Dự là tham dự, đồng dự, người có liên quan, có tham dự. ( Ví dụ: có người mất của hỏi được quẻ Dự. Nhà có người giúp việc, con trai, cháu trai đến chơi → Con trai bẻ khoá, cháu bê đi, rủ nhau bán để hút thử thuốc phiện xem sao ).
• Dự bị, dự phòng, dự trữ.
• Vinh dự, danh dự.
• Dựng nghiệp xây dựng, xây nhà, dựng vợ gả chồng, khởi đầu thuận lợi (quẻ Dự đẹp nhất cho khởi đầu).
• Dự là “thuận dĩ động dự, dự thuận dĩ động” (Động mà thuận theo là dự • hoà vui, hoà vui mà thuận theo nên động vậy). Phàm sự vật lúc bế thì uất, khi đã phấn phát thì thông xướng mà hoà vui, hoà vui của sự thông xướng là dự vậy.
• Dự là do dự, chưa quyết, còn phân vân, chưa quyết định, chưa ngả hẳn về bên nào, chưa rõ ràng.
• Thuỳ châu nhỏ lệ ( Nước mắt vui mừng, nước mắt đau buồn đám tang ).

27. LÔI THỦY GIẢI :
CHẤN thượng - KHẢM hạ
**Cách :** “Ngũ quan thoát nạn” (Thoát qua 5 cái cửa). Giải thoát khỏi nạn.

**Tượng :** “Lôi vũ tác” (Sấm mưa cùng tác động).

**Nghĩa :**
• Giải tán, cởi ra, gỡ ra, thoát khỏi, tan biến, tán phát, khuếch tán (không tụ được).
• Giải hoạn nạn, giải oan ức.
• Giải là rút lui, rút lui mà “vô sở vãng” (không lợi cho tiến hành công việc ban đầu), không nên đi.
• Cầu siêu, cầu cúng, giải hạn, giải oan, giải thoát vong linh, cúng tế. ( Lập đàn tràng cúng lễ ).
• Giải trừ, hoá giải ( vì vậy nói “ngũ quan thoát nạn”).
• Giảng giải, giải thích ( dạy dỗ, tượng của giáo viên ).
• ( Quẻ ngũ linh đời người: người có khả năng nói, làm giáo viên ).

28. LÔI PHONG HẰNG :
CHẤN thượng - TỐN hạ
**Cách :** “Ngư lai động võng” (Cá chui động lưới).

**Tượng :** “Lôi động dĩ phong” (Sấm động có gió).

**Nghĩa :**
• Cửu, lâu dài, vĩnh cửu, vĩnh hằng.
• Hằng là thường, thường thường, thông thường, thường xuyên, luân thường, bình thường, đương nhiên cứ thế (Đạo thường muốn giữ được phải có chữ trinh, không trinh chính thì không thể giữ được đạo thường. Mặt khác muốn có thường thì phải động, động thì chót cùng rồi lại đầu vì thế mới là đạo thường, đạo thường thì không cùng tận vậy). Hằng: phải động mới có được đạo thường, loại trừ cái xấu xa, giữ được chính trinh: Phải có giao dịch.
• Sự ăn ở của vợ chồng.
• *Quẻ Hàm*: tượng của cưới hỏi (yêu nhau thì trai thuận theo gái, cảm, Đoài trên Cấn dưới).
• *Quẻ Hằng*: tượng của quan hệ vợ chồng sau khi cưới (Lấy nhau gái thuận theo trai, nên Chấn ở trên Tốn ở dưới, đạo vợ chồng là cả quá trình lâu dài gắn bó, là cửu).

29. ĐỊA PHONG THĂNG :
KHÔN thượng - TỐN hạ
**Dịch tự / Tượng người :** Tượng của người bước vào nấc thang đầu của quyền lực, quan chức, danh vọng.

**Cách :** “Chi nhật cao thăng” (Mặt trời lên).

**Tượng :** “Đại trung sinh mộc” (Trong đất sinh ra cây).

**Nghĩa :**
• Tiến lên, thăng lên (bay lên), lớn lên, ở phía trước, trên cao, tương lai. Vì vậy thời của quẻ Thăng là tiến lên phía trước thì tốt, đúng thời (nếu ai hỏi có nên tiến hành hay không nên: tiến đi).
• Thất thoát, hao hụt, thăng hoa, là giảm đi. (Ví dụ: cho vay, muốn đòi thì sẽ đòi được nhưng chưa lấy được ngay và sẽ không được trọn vẹn, bị hao hụt. Giao dịch đất cát: sẽ được nhưng hao tổn).
• Mất, mất mát, bay đi mất, không còn nữa, chết, thăng thiên (về suối vàng), thoát lạc. (Nếu hỏi về bệnh là linh hồn bay mất).

30. THỦY PHONG TỈNH :
KHẢM thượng - TỐN hạ
**Cách :** “Khô tỉnh sinh tuyền” (Giếng khô sinh nước).

**Tượng :** “Mộc thượng hữu thuỷ” (Trên cây có nước: nước ở cái gầu trên cần múc nước).

**Nghĩa :**
• Tỉnh là tĩnh, tĩnh lặng, yên tĩnh đợi thời (giếng không thể chuyển nên tĩnh), không tĩnh mà manh động sẽ gặp hoạ.
• Tỉnh là giếng.
• Hào 1: âm mềm, tượng mạch suối (tương đối đẹp, có nước ăn).
• Hào 2, hào 3: dương cương, đá cuội dưới đáy (không có nước, chỉ có đá. Hào 2 động sẽ biến ra quẻ Kiển. Hào 3 động biến Thuần Khảm, bất trung bất chính).
• Hào 4: Âm mềm, chỗ rỗng trong giếng (tạm có nước, chỉ có những việc cấp bách đến chân tường, việc buộc phải dùng mới tốt, việc nhỏ không tốt vì động biến ra quẻ Đại quá ứng việc lớn).
• Hào 5: dương cứng, nước sắp tràn (rất tốt vì hào đắc trung, đắc chính, quẻ Khảm thể hiện là người trí tuệ hơn người).
• Hào 6: âm nhu là chỗ rỗng của miệng giếng.
• Tỉnh là sâu, độ sâu, thâm sâu.
• Tỉnh là tề chỉnh, rành rọt, đâu ra đấy.
• Bước đầu của sự nghiệp, bước đầu lập ấp (người xưa lập ấp, trước khi lập ấp bao giờ cũng phải xem khí đất để thăm dò mạch nước đào giếng. Vì vậy thời quả quẻ Tỉnh là lợi cho lập ấp, kiến tạo xây dựng).

31. TRẠCH PHONG ĐẠI QUÁ :
ĐOÀI thượng - TỐN hạ
**Cách :** “Dạ mộng kim ngân” (Đêm mơ thấy vàng) hay gặp hoạ.

**Tượng :** “Trạch diệt mộc” (nước đầm làm chết cây).

**Nghĩa :**
• Là hoạ, tai hoạ, hoạ hại.
• Là hư hao, gian nan quá mức. (Ví dụ đi quá nơi cần đến, hao phí sức lực).
• Là quá lớn, “cái lớn quá sự thường hay sự thường thành quá lớn” (Việc lớn quá sự thường: là chỉ những việc đại sự. Gặp việc đại sự, biết ứng xử theo đại sự, theo đạo của người quân tử ắt thành công, việc lớn ứng theo kiểu tiểu nhân ắt gặp hoạ. Ngược lại sự thường là những việc nhỏ nhặt, tiểu sự. Việc nhỏ, tiểu sự thì chỉ cần Tiểu quá • quá nhỏ, vậy mà ứng theo đại quá là sự thường thành quá lớn ắt gặp hoạ). Đại quá việc lớn thì hanh thông mà việc nhỏ thì hữu hung. Đại quá là “cái lớn quá thường” mà Tiểu quá là “cái nhỏ quá thường”.
• Sự nhầm lớn, là cả quá, là sự nhầm lớn vượt quá đạo lý thông thường.
• Làm đi làm lại (đi quá thì phải quay lại).
• Tượng của khoa phong thuỷ địa lý.

32. TRẠCH LÔI TÙY :
ĐOÀI thượng - CHẤN hạ
**Cách :** “Song xa kháo nhai” (Hai xe tựa vào nhau).

**Tượng :** “Trạch trung hữu lôi” (Giữa đầm có sấm nổ).

**Nghĩa :**
• Là tòng, tuỳ tòng, tuỳ thuộc, tuỳ phái viên, tùy viên, cấp dưới.
• Thuận theo, theo.
• Thoái lui, ở ẩn, thoái ẩn, buông rèm nhiếp chính ( Đoài là cái mồm, Chấn là sấm là lời, mượn mồm kẻ khác nói lời sấm của ta, như thế là động mà không lộ).
• Đẹp lòng (tượng trung chính, buông rèm nhiếp chính vẫn phải trung chính). Đoài ở trên là đẹp lòng, Chấn dưới động: đẹp lòng mà động, vì có động của dưới mà đẹp lòng trên, “song xa kháo nhai” 2 xe dựa vào nhau mà tiến bước.
• Tùy giữ trung chính mà thành Cách (thay đổi theo hướng tiến bộ, khác với hoán là thay đổi đơn thuần).

•••

CUNG TỐN

33. THUẦN TỐN :
TỐN thượng - TỐN hạ
**Cách :** “Cô chu đắc thuỷ” (Thuyền cô (lẻ) mắc cạn gặp thuỷ). Ban đầu gặp khó khăn sau cũng gặp thuận lợi.

**Tượng :** “Tùy phong Tốn” (Theo gió mà thành Tốn). Gió to. Đối với tiếng tăm là có lợi, kinh doanh lợi lộc thì không lợi.

**Nghĩa :**
• Tốn là vào, núp vào, nhập vào (Gió mềm hoà tan vào vật khác). Tượng quẻ có 2 hào dương chìm lún vào quẻ đại Khảm ở dưới. Là quẻ lục xung nhưng không phải tan rã mà lại kết hợp vào.
• Tốn là nhún, thuận, nhún nhường, thuận theo (Đoài cũng là thuận theo, nhưng quẻ Đoài là trong cương ngoài nhu, tức là thuận theo có chủ kiến, có nghệ thuật, dùng phép nhu, thuận theo mà hanh thông. Quẻ Tốn là ngoài cương trong nhu, là tính mềm tức là tòng theo, tòng theo thuộc nhu không có chính kiến tiểu hanh thông, đa hung).
• Tốn là cổ động : “Tốn dĩ cổ chi”, sự quảng cáo, marketing, sự khuếch trương thanh thế (Ngũ linh đời người: hợp với quảng cáo, bán hàng, chào hàng).
• Tốn chỉ sự thay đổi (theo gió là sự đổi), là sự không kiên định. (Bản mệnh tương ứng sao Thiên Đồng trong tử vi. Mệnh quẻ Tốn: người thích vận động, công việc, tư tưởng, suy nghĩ thay đổi, tính hay thay đổi. Không làm lãnh đạo, chỉ nên cổ động, khác với thuần Chấn: người lãnh đạo, có tiếng vang). Xem việc ra quẻ thuần Tốn : xấu, dễ giải thể. Nhưng khi ta lệ thuộc vào một cái chính thì ta thắng. Ví dụ công ty A, ta là cổ đông Y thì ta thắng.

34. PHONG THIÊN TIỂU SÚC :
TỐN thượng - CÀN hạ
**Cách :** “Mật vân bất vũ” (Mây dày chưa mưa). Như thị trường chứng khoán căng thẳng khi ta đang mua.

**Tượng :** “Phong hành thiên thượng” (Gió đi trên trời).

**Nghĩa :**
• Tiểu Súc là tích, tích chứa, tích tụ, tích cóp, dự trữ (đang chờ thời).
• Nuôi, nuôi dưỡng (Trời bao la để gió thổi bên trên. Tuỳ hỗ là quẻ Hỏa Thiên Đại hữu).
• Tiểu Súc là đậu, đậu vào, đỗ vào, dừng (việc đang dừng phải chờ đợi, đang tích trữ thông tin chờ tiến tới kết quả).
• *Đại Súc*: dừng mà co lại (liệt, co quắp).
• *Tiểu Súc*: dừng không phát triển, bệnh tật mới biểu hiện triệu chứng bệnh.
• Chứa nhỏ: Cái Tốn nhỏ chứa cái Càn (trời) lớn → sự dừng lại, kiềm toả nhỏ.
• Việc nhỏ thì hanh thông (trong giai đoạn ngắn, không để kéo dài). Mua bán kinh doanh bất động sản: mua giá nhỏ, giá hơi cao bán luôn.
• Tiểu Súc là ràng buộc (ràng buộc tạm thời, không bền chặt). (Quẻ Tốn lấy cái nhu của mình mà ràng buộc, nhưng không thể nén được sự cứng mạnh của quẻ Càn vì thế mà chỉ là tạm thời. Hào 4 âm nhu đắc vị chứa hào 5 dương. Lấy nhỏ chứa lớn, buộc được mà không bền. Trước sau ắt sẽ tràn ra. Ví như quan hệ vợ chồng mà chỉ lấy cái âm nhu mà buộc chân chồng là không bền vậy ). Nếu xem hôn nhân thì không tốt vì không bền lâu.
• Tiểu Súc là tiếp xúc, giao dịch nhỏ ( giai đoạn đầu, giao dịch cấp thấp, việc nhỏ, thời gian ngắn ).

35. PHONG HỎA GIA NHÂN :
TỐN thượng - LY hạ
**Dịch tự :** có hình tượng của cô gái bụng ở đâu, chân ở đó.

**Cách :** “Quản thủ lân chi” (Xum họp đại gia đình các chi phái). Quán xuyến cai quản.

**Tượng :** “Phong tự hỏa xuất” (Gió từ trong lửa mà ra).

**Nghĩa :**
• Người nhà, đạo nhà (tình cha con, nghĩa vợ chồng) “gia nội chi nhân”.
• Trật tự, luân lý, phép tắc, gia quy, cương thường đạo lý.
• Là người con gái (có quan hệ với người xem).
• Người con gái tóc dài hơi thưa, khuôn mặt trái xoan, răng khểnh, dáng dong dỏng cao, nhẹ nhàng, chân dài, có thể có vết sẹo ở đuôi mắt. (Sơ đồ : Tốn là tóc thưa; Ly khuôn mặt).
• Có gốc, có căn cứ, cơ sở, nguyên nhân, có nguyên do (không có lửa làm sao có khói) vì vậy bảo “phong tự hoả xuất” tức sự việc từ nội bộ mà ra. Mất đoàn kết. Thất thoát thông tin nội bộ hoặc nguyên nhân xuất phát từ nội bộ. ( Ví dụ nhà mất cắp, được quẻ Gia nhân: người ở lấy, bạn trai người ở lấy…).
• Khối u, ung nhọt ( Ly là nóng trong, Tốn là gai ).
• Đồng ( hoà đồng ), đại đồng ( nghèo ), sum họp, họp hành gia đình ( mâu thuẫn, không đồng lòng, không nhất trí ).
  • Gia Nhân động hào 2 (nội): họp đại gia đình.
  • Gia Nhân động hào 3, 4, 5, 6 (ngoại): đi với người con gái.

36. PHONG LÔI ÍCH :
TỐN thượng - CHẤN hạ
**Dịch tự :** tượng của người nằm ngửa, đang chờ thông tin, quan chức ngồi thụ hưởng, nghỉ ngơi (hoặc người làm ăn kinh doanh được lợi), nhưng đầu vẫn đang tư duy. Khuyết, không đầy đặn.

**Cách :** “Khô mộc khai hoa” (Cây khô nở hoa). Như người già sinh con… → trái quy luật. (Khác với Tổn: đúng quy luật). Ích lợi nhỏ, tàng ẩn sự hung hại bên trong. Sau khi Tổn là Ích, nếu Ích trước thì phải Tổn, giống quá trình kinh doanh: Tiền (Tổn) • Hàng (Ích) • Tiền (Tổn) • Hàng ( Ích ) • Tiền ( Tổn ) • Hàng ...

**Tượng :** “Thượng phong hạ lôi” (Trước gió sau sấm, trên gió dưới sấm). Gió đến thì sấm đến tượng của sự hư không, phải lo lắng về sau cần đề phòng.

**Nghĩa :**
• Ích là thêm, tăng thêm, được lợi thêm (Tốn trên bớt một hào âm cho Chấn ở dưới, tổn thượng ích hạ).
• Lợi ích, bổ ích, phong túc (sung túc, phong mãn).
• Sự trợ giúp, giúp sức của người khác (bậc quyền quý giúp ta dễ thành công).
  • *Tổn*: tự ta làm thành công.
  • *Ích*: tự ta làm không thành công phải nhờ sự trợ giúp bên trên, bên ngoài.
• Ích là sự di dời, chuyển dịch: đi lại gặp Ích là tốt, chuyển nhà (các quẻ Di, Lý, Hoán: đi lại).
• Ích là sừ (lưỡi cày): bắt đầu canh tác, bắt đầu xây dựng thì Ích thật. ( Sơ đồ : Trên là Tốn mộc, có nhiều hào âm cong. Dưới một hào dương cứng là mũi cày ).
• Hành lễ, cúng tế, tang ma ( hiếu lễ, hung lễ ). Xem quẻ nếu ốm nặng dễ chết: tăng thêm bệnh thì chết. Hôn nhân nếu gặp quẻ Ích thì con trai thiệt thòi ( tốt âm, hại dương: trai bị tổn hại về sức khỏe, công việc khó khăn, gia súc chết, nhiều chuyện xảy ra → lụi bại ).
• *Quẻ Ích* : Với ngoại nhân là ích, với nội nhân là tổn. “Tự ngã Ích tắc tổn, tổn tắc ích; tổn vị chi ích” (Với ta thì Ích là tổn, được quẻ Tổn thì là ích, quẻ Tổn mới thật là ích). (Nếu ta là người bên ngoài, là người môi giới ở giữa, công việc thành hay bại cũng không liên quan đến ta thì ta được lợi. Nếu ta là người trong cuộc: cùng kinh doanh, quản lý, cùng chịu lỗ lãi thì sẽ tổn, không có lợi).

37. THIÊN LÔI VÔ VỌNG :
CÀN thượng - CHẤN hạ
**Cách :** “Điểu bị lũng lao” (Chim bị sa lưới).

**Tượng :** “Thiên hạ lôi hành” (Dưới trời sấm động). Gầm trời nhiều sự cố → hung, loạn.

**Ví dụ (nguồn) :** Có người khởi công làm nhà vào giờ Tỵ ngày Nhâm Dần (25/8/Nhâm Ngọ). Ra quẻ Thiên Lôi Vô vọng biến Phong Lôi Ích, ngay trong ngày hôm đó buổi chiều đi xe ôm gọi cát, đá, sỏi thì xe ôm lao vào ô tô; người lái xe ôm không sao, còn chủ nhà bị chấn thương sọ não.

**Nghĩa :**
• Vô Vọng là vô dục vọng, phóng nhậm tự nhiên (tự dưng được tha), là không cần kỳ vọng mà vẫn có được.
• Vô hy vọng, không còn sự mong chờ. (Xuất hành càng xấu).
• Là im tiếng không có sự hồi âm, không có tiến triển, không có tin. ( “điểu bị lũng lao” không còn thấy tiếng là hung, nên muốn tránh hoạ thì phải vô dục vọng mà giữ chính vậy ).
• Không càn bậy, thành thật (động theo lẽ trời mà không dục vọng là đúng quy luật. Không càn bậy, càn bậy không theo: tốt, là sự thành thật. Động mà theo lòng dục của người là càn. Phàm con người ta đa phần là không có tà tâm, nhưng nếu đi theo mà không hợp chính lý vẫn được coi là càn, là có tà tâm).
• Là tù ngục ( đó là vô vọng mà theo lòng dục của người. Vô vọng chỉ tốt cho sự chính, nếu không chính là càn bậy mà bị hình pháp, tù ngục vậy ). Mệnh ra quẻ Vô Vọng là tàng chứa sự tù tội, quẻ lục xung, là người cứng, mạnh, đại ca.
• Sự bế tắc, bất giao hoà, chẳng lợi cho sự đi lại “bất lợi hữu du vãng” ( thường xảy ra ở quẻ biến ).
• ( Mất vật thì lợi: vật bị mất không có dục vọng, quẻ bất giao hoà thì không mất. Xem ốm đau: vừa ốm thì khỏi, ốm lâu chết ).

**Bảng các quẻ biểu hiện tù ngục (nguồn) :**
| Quẻ | Loại tù ngục |
|•••|•••|
| Càn | Tù chính trị |
| Vô vọng | Đại hình |
| Cách | Chính trị |
| Sư | Quân sự |
| Phệ hạp | Hình sự thường |

**Ví dụ (nguồn) :** giờ Nhâm Thìn, ngày Bính Tuất (6/2/Nhâm Ngọ) hỏi xuất hành có tốt hay không. Được quẻ Thiên Địa Bĩ biến Thiên Lôi Vô Vọng. Bĩ là bế tắc → biến ra Vô Vọng là đi sẽ gặp tai nạn.

38. HỎA LÔI PHỆ HẠP :
LY thượng - CHẤN hạ
**Cách :** “Cơ nhân ngộ thực” (người cơ nhỡ được mời ăn). Người tốt giúp đỡ ăn, hoặc ăn bữa cuối trước khi chết. Đang khó khăn gặp được người giúp đỡ, thất cơ lỡ vận gặp được người giúp đỡ chứ không phải là người ăn mày, người có tư cách đàng hoàng.

**Tượng :** “Lôi điện” (Sấm điện). Lôi: nhanh, khó khăn giai đoạn ngắn. Cơ quan nhà nước hoặc công đường (Toà án), những chỗ thâm sâu, tầng lớp trên.

**Nghĩa :**
• Phệ Hạp là khiết hợp (cắn hợp) (Tượng quẻ hào 4 như một cái đũa ngáng qua miệng hoặc là cái xương làm cho khó ăn uống phải cắn vỡ đi mới ăn được → cắn vỡ để thành quẻ Sơn Lôi Di).
• Pháp lý, pháp độ, tù ngục, tranh tụng.
  • *Quẻ Phệ Hạp*: tụng hình sự.
  • *Quẻ Tụng*: tranh tụng dân sự, kinh tế, hôn nhân gia đình, lao động…
• Là cái chợ, họp chợ (thường là chợ trưa): Trên Ly là mặt trời, dưới Chấn là sự ồn ào náo nhiệt (chợ vỡ).
• Hóc xương, ngộ độc thức ăn.

**Ví dụ (nguồn) :** Hỏi việc xảy ra ở Ba Lan được quẻ Hoả Lôi Phệ hạp biến ra Thiên Lôi Vô Vọng. Phệ Hạp là bắt bớ giam cầm liên quan đến tù ngục.
Các quẻ hỗ của Phệ Hạp (theo hào): Hỗ 1: Vị tế; Hỗ 2: Lữ; Hỗ 3: Kiển; Hỗ 4: Cấu; Hỗ 5: Độn; Hỗ 6: Tiệm.
Hỗ 1 ra Hỏa Thủy Vị Tế: việc chưa xong, chưa bị bắt, án chưa thành, đang bị phục (Lữ), trong tình trạng nguy hiểm (Kiển), bỏ của (Cấu) chạy lấy người (Độn), không bị bắt (Cấu, Tiệm). Kết quả là Vô Vọng: phóng nhậm tự nhiên, không có chuyện gì.

39. SƠN LÔI DI :
CẤN thượng - CHẤN hạ
**Dịch tự :** giống như người đang chạy bị trượt chân (gặp khó khăn, như người vô gia cư bị vùi dập, trù dập).

**Cách :** “Vị thuỷ phong hiền” (Đến sông Vị cầu người tài).

**Tượng :** “Sơn hạ hữu lôi” (Dưới núi có sấm). Sấm tháng 3 cho mạ ra đòng.

**Nghĩa :**
• Nuôi dưỡng, dưỡng dục, dưỡng của trời đất nuôi vạn vật, nuôi dưỡng con người.
• Giúp đỡ, sự giúp đỡ có lực để thành công (“Vị thủy phong hiền” nói về Văn Vương đến sông Vị mời Khương Tử Nha).
• Miệng, mép, sự ăn uống (Trên là Cấn tĩnh: hàm trên cứng, Dưới là Chấn động: hàm dưới há ăn).
• Là ổ bụng, khoang bụng (đau bụng, chửa đẻ, có thai).
• Di chuyển, di dời, đi động. (Khác với Minh Di là di diệt, trù úm).

40. SƠN PHONG CỔ :
CẤN thượng - TỐN hạ
**Dịch tự :** như hình của thằng điên xé quấn xé áo lang thang, tượng của kẻ bị tà nhập, cuộc sống bị hình hại chia làm nhiều mảng.

**Cách :** “Suy ma phân giao” (Gió quần khe núi); “Suy ma phấn đạo” (Diệt trừ ma quỷ).

**Tượng :** “Sơn hạ hữu phong” (Dưới núi có gió) → Gió độc.

**Nghĩa :**
• Sự đổ nát, nát loạn, hư hoại, phá huỷ, loạn (Việc gia đình mà ra quẻ Cổ: nát, anh em cãi vã...).
• Sự mê hoặc (Con gái lớn là Tốn lôi kéo con trai mới lớn là Cấn), hãm hại (chữ Cổ 蠱 hình của ba con sâu độc thả trong chậu).
• Sự rò rỉ, rò rỉ từ bên trong rò ra (Tin thất thoát từ nội bộ).
• Sự đam mê, thần tượng, tôn thờ (Hôn nhân: đam mê nhưng sẽ đổ vỡ).
• Là tam phá cách (Ba lần phá) vì vậy mà soán nói: “tiêu giáp tam nhật, hậu giáp tam nhật, chung tắc hữu thủy thiên hành giả (trước giáp 3 ngày sau giáp 3 ngày, chót thì có đầu, cuộc vận hành của trời đất vậy tức nếu phá 3 lần rồi thì tốt đẹp vậy). Mệnh ra quẻ Cổ là hay phải làm đi làm lại, ba lần lập gia đình, ba lần kinh doanh đổ vỡ... (Trước ngày xem ba ngày, sau ngày xem ba ngày. Trước ba lần phá thì lần này thành, trước chưa bị thì còn bị phá mấy lần nữa).
• Bệnh điên, bệnh do dâm dục, do mê hoặc, bệnh do thuốc độc gây ra, bệnh cổ trướng, phù thũng.
• Nghi hoặc, nghi ngờ lẫn nhau.
• *Bản chất Cổ là thích phá phách. Chỉ tốt cho sự phá bỏ cái cũ, xây dựng cái mới. Cổ không thích hợp cho việc phát triển cái cũ, cái đã và đang có.*
• Xem mồ mả thì xấu, nếu an táng sẽ lần lượt phá huỷ hết.

•••

CUNG LY

41. THUẦN LY :
LY thượng - LY hạ
**Dịch tự :** Dịch tượng có dáng một người thảnh thơi, được hưởng phú quý thanh nhàn.

**Cách :** “Thiên quan tứ phúc” (Phúc trời ban), ân tự, ân sủng. Có ánh sáng là có phúc.

**Tượng :** “Minh lưỡng tác Ly” (Hai lần sáng là Ly). Ly và Đoài là hai quẻ đẹp trong số các quẻ lục xung.

**Nghĩa :**
• Là lệ, tráng lệ, lộng lẫy, sáng đẹp, văn minh.
• Hỷ khánh chi sự (vui vẻ may mắn, “thiên quan tứ phúc” ánh sáng chiếu tới chính là sự may mắn), sáng tỏ, sự thông tỏ, là phúc đức trời ban. (Ví dụ thi cử đỗ đạt, cuộc đời thông suốt, hanh thông, phúc dày).
• Lệ thuộc, bám dính (bám đúng chỗ) “Chim khôn đậu nóc nhà quan”. (Trong trời đất mọi vật đều cần phải bám phải, nếu bám đúng chỗ thì hanh thông, ngược lại không bám đúng chỗ thì là mắc vậy).
• Là mắc, mắc kẹt (bám không đúng chỗ), vướng mắc, vây khốn, mắc do bên trong.
• Là lệ (nước mắt) thường là lệ của hạnh phúc. (Quẻ Lôi Địa Dự là nước mắt của niềm vui cũng là nước mắt của sự đau khổ).
• Mắt, mồm, quả tim ( Nếu động hào 5 biến ra Thiên Hỏa Đồng nhân: Càn là mũi tên xuyên qua tim ).
• Xe cộ ( Ly là xe máy, còn Khảm là ô tô), trâu cái, trai, ốc, cua, tò vò, áo giáp, mũ sắt, mũi tên đồng. Tượng huyệt kết (huyệt nổi khum khum như vỏ trai ).
• Chim vàng anh, chim hót, tằm nhả tơ (tượng có chim hót, sinh ra người văn chương giỏi).
• Mặt trời, ánh sáng, lửa đang cháy sáng (Ly là mặt trời, Càn là bầu trời).
• Trống rỗng (Ly trung hư), không có gì thực. (Ví dụ: chủ tịch công đoàn có tiếng không có thực quyền).
• Là sơn thần thú (山神獸 thần núi hình thú, là thần hay xuất hiện lúc mặt trời lặn, người ta hay cúng bằng gia cầm).
• Sa lưới, “Trĩ ly vu la” (gà rừng sa lưới). (Tù ngục: quẻ Ly bị bắt, quẻ Độn trốn được).

42. HỎA SƠN LỮ :
LY thượng - CẤN hạ
**Dịch tự :** có hình như người lang thang cơ nhỡ, không biết đi về đâu, hành khất.

**Cách :** “Tức điểu phần sào” (Chim mất tổ).

**Tượng :** “Sơn thượng hữu hỏa” (Trên núi có lửa), núi lửa.

**Nghĩa :**
• Lữ, lữ khách, người đi đường xa, quán trọ, người ở trọ. (Tốt cho đi xa, việc nhỏ tiểu cát).
• Sự đông đúc, nhiều người, là lữ đoàn (quân đội).
• Sự thất cơ lỡ vận, mất nơi ở yên ổn, vất vả chạy vạy ngược xuôi (“Tức điểu phần sào”). Nếu xem đất cát, nhà cửa thì không tốt (vì Lữ hợp với động, không hợp với sự tĩnh, dễ bị quy hoạch, giải phóng mặt bằng sau này).
• Sự vướng mắc, mắc kẹt (khác Ly vì Ly mắc bên trong do chủ thể, chủ quan, nội bộ còn Lữ mắc do khách quan bên ngoài). Ví dụ xin chuyển công tác ra quẻ Ly là mắc ở nơi xin đi, ra quẻ Lữ là mắc ở nơi xin đến.
• Cô đơn, lẻ loi, đơn độc (Ly là nữ động muốn đi, phải đi. Cấn là nam không muốn đi).
• Là núi lửa.
• Là cung tên (Ly là mũi tên động, Cấn là cái cung tĩnh).
• Sự tạm, tạm thời (lửa trên núi là tạm thời, lửa trong lò ở nhà mới là vĩnh cửu, cũng như khách trọ chỉ là tạm thời mà thôi). Nếu xin việc chỉ được ở một thời gian rồi lại phải đi nơi khác.
• Chỉ sự quyết đoán ( nếu quyết đoán ngay thì tiểu hanh, còn do dự phân vân ắt là rước họa. Lữ có Ly bên trên tượng sa lưới ).

43. HỎA PHONG ĐỈNH :
LY thượng - TỐN hạ
**Dịch tự :** hình người bị gãy chân (xe cộ, tai nạn).

**Cách :** “Ngư ông đắc lợi” (Tích trai và cò tranh cãi nhau, trai kẹp mỏ cò, ông đánh cá cho cả hai vào rỏ).

**Tượng :** “Mộc thượng hữu hỏa” (Trên cây có lửa). Như là que diêm, tượng của sự đun nấu.

**Nghĩa :**
• Đỉnh là cái vạc, đỉnh đồng ba chân, lư hương, vật đựng đồ tế lễ. (Đỉnh là đồ vật phục vụ nhu cầu ăn, Tỉnh là phục vụ nhu cầu uống).
• Đỉnh là đĩnh đạc, nghiêm trang, sự chỉnh tề, sự vững vàng, an ninh (Mệnh ra quẻ Đỉnh là người đầu tóc bóng lộn, chải chuốt, quần áo gọn gàng, ra dáng “sếp”).
• Đỉnh là sự an bài, cố định, sự việc đã hoàn thành (sự việc đã thành không cần bàn, giống như Thuỷ Hoả Ký Tế không lợi cho những việc bắt đầu tiến hành).
• Đỉnh là sự nuôi dưỡng, no đủ.
• Đỉnh là tượng bị gãy chân (Đặc biệt là động hào 4 biến Phong Sơn Cổ thì càng chính xác).
• Đỉnh là bó đuốc, bếp củi, tượng của cháy rừng (“Mộc thượng hữu hỏa”, tượng lửa cháy ở đầu que củi, đầu bó đuốc).

44. HỎA THỦY VỊ TẾ :
LY thượng - KHẢM hạ
**Cách :** “Tiểu hồ ngật tế” (Con cáo giấu đầu hở đuôi). Do vô tình lộ, mâu thuẫn, tráo trở đầu đuôi.

**Tượng :** “Hỏa tại thuỷ thượng” (Lửa ở trên nước). Lửa ở trên bốc lên, nước chìm xuống, chỉ sự không giao hoà (giống quẻ Bĩ).

**Nghĩa :**
• Việc chưa xong, chưa thành (Nếu xem ốm đau thì chưa chết).
• Thời kỳ quá độ, giai đoạn chuyển tiếp.
• Thất thoát, mất mát, thiệt thòi, thất thế, thất thoát thông tin, giấu đầu hở đôi (còn là thông tin, tín hiệu điện tín, tín hiệu mooc xơ cấp cứu SOS).
• Tráo trở đầu đuôi, là người đi sau lại thành về trước (Thi cử, xin việc… người tưởng được lại không được, mà người khác lại thế chỗ đó).

45. SƠN THỦY MÔNG :
CẤN thượng - KHẢM hạ
**Dịch tự :** như người chả biết đi về đâu, lờ mờ không rõ ràng.

**Cách :** “Tiểu quỷ thâu tiên” (Quỷ nhỏ giữ được tiên). “Tiêu quỹ thâu tiên” (Đưa mắt về phía trước chỉ thấy mặt trời tan khuất vào đêm, bóng đen, mông lung).

**Tượng :** “Sơn hạ xuất tuyền” (Suối tuôn dưới núi. Dưới núi có dòng nước chảy). Thời tiết ra quẻ Mông thì lúc mưa lúc tạnh (100 bước phải mang áo mưa). Quẻ Ly sáng lẩn trốn trong quẻ, tượng sự che đậy (như Tôn Tẫn giả điên).

**Nghĩa :**
• Mông là tối tăm, mờ mịt, sự che đậy, mông muội không rõ ràng, là vật mới sinh còn chưa sáng tỏ.
• Mông là sự khai phát, khai sáng (Chỉ sự giáo dục dạy dỗ). Mệnh ra quẻ Mông phù hợp nghề dạy học: nghiêm khắc, mềm mỏng.
• Trẻ thơ, trẻ con còn non dại, thiếu kinh nghiệm, thiếu kiềm chế, ngông cuồng, rồ dại của tuổi trẻ (“Tiểu quỷ thâu tiên”).
• Là loại cỏ mọc lan, khi mọc tốt có thể che lấp được cả cây cối khác.
• Mông là bị cướp, bị trộm cắp, bị chặn đường cướp giật, cướp đoạt.

46. PHONG THỦY HOÁN :
TỐN thượng - KHẢM hạ
**Dịch tự :** như người đang reo “A ha thoát được rồi” (Vừa ly hôn).

**Cách :** “Hà vọng kim” (Nhìn qua sông thấy vàng). Nhìn thấy phía trước.

**Tượng :** “Phong hành thuỷ thượng” Gió thổi trên mặt nước.

**Nghĩa :**
• Là tán, phân tán (Ví dụ xem hôn nhân ra quẻ Hoán thì sẽ ly hôn, ly biệt nhau).
• Là hanh thông, phân tán thành công, tiểu hanh thông (thời gian ngắn). Hanh thông của sự phân tán thành công như việc ly hôn sẽ xong xuôi chứ không phải hôn nhân sẽ tốt hơn.
• Là lụt lội, đại hồng thuỷ tràn lan.
• Là sự thay đổi, hoán cải (Mệnh ra quẻ Hoán: vất vả, phải thay đổi công việc, nhà cửa, chỗ ở).
• Hoán là bất thâu tóm (vật luôn nằm ngoài tầm tay, quá vòng kiểm soát của ta, vậy nên nói là “Quá hà vọng kim”).
• Hoán là phản lại, sự lật mặt (vì thế Hoán cho ta thông tin cần phải cẩn thận với chính người gần ta nhất (ta tin nhất), cũng chính vì sự phản lại mà thành hoán, chia lìa vậy).
• Hoán là tượng bệnh gan (u gan, sơ gan), phù thũng, úng thuỷ, ung nhọt. (Sơ đồ: Ung nhọt, gan; Phù thũng, nước). Thủy vượng là bệnh khớp. Ly trung hư là chỗ khớp xoay (nơi hai đoạn xương tiếp giáp nhau là vạch đứt của Ly).

47. THIÊN THỦY TỤNG :
CÀN thượng - KHẢM hạ
**Dịch tự :** tượng người giơ tay phân trần, tranh cãi.

**Cách :** “Nhị nhân tranh lộ” (Hai người tranh nhau cùng một con đường đi). Chọn một trong hai vào một vị trí quan trọng.

**Tượng :** “Thiên dữ thuỷ vi hành” (Trời và đất chuyển dịch ngược chiều nhau). Thiên: Trời là ánh sáng quang minh (thật), Khảm: mắc hãm, âm mưu (tà). Chính đạo có nguy cơ bị che khuất, tà đạo trỗi dậy.

**Nghĩa :**
• Mâu thuẫn, kiện cáo, tranh tụng. (Chủ yếu là giữa công dân với nhau).
  • *Quẻ Phệ hạp*: tụng hình sự.
  • *Quẻ Tụng*: tranh tụng dân sự, kinh tế, hôn nhân gia đình, lao động…
• Là sự bế tắc. (Xem công việc đa phần ứng với nghĩa này. Ngoài Càn rắn, trong Khảm mềm nên khó thành công).
• Sự sợ hãi, kiêng dè, e ngại nhau (không nên căng quá, nên nhẹ nhàng giải quyết, thỏa hiệp, Tụng đang ở thế yếu nên dè dặt). “Bất lợi thiệp đại xuyên” (Không lợi cho việc vượt sông lớn) không nên tiến hành công việc đến cùng nên hoà giải giữa chừng.
• Sự chinh phạt, đem quân đi chinh phạt (lợi cho người động trước, lợi khách không lợi chủ).
• Tụng là người có công nhưng không nên nhận hưởng (Hãy để cho cấp trên hưởng, mình thực làm nhưng không nên thực hưởng, cứ im lặng rồi sau đó mọi người sẽ hiểu → tích Phạm Lãi sau khi thành công thì lui về ở ẩn).

48. THIÊN HỎA ĐỒNG NHÂN :
CÀN thượng - LY hạ
**Dịch tự :** có tượng người đi tiên phong, đi trước định hướng.

**Cách :** “Tiên nhân chỉ lộ” (Người đi trước chỉ đường).

**Tượng :** “Thiên dữ hoả” (Trời cùng hỏa tương giao).

**Nghĩa :**
• Cùng người, hòa đồng với mọi người, đồng tâm, đồng ý, thống nhất ý chí.
• Tượng của sự vắng mặt (do vừa đi khỏi), nếu chết là vừa mới chết.
• Người nghèo, sự đạm bạc (Càn tròn là lạc rang, là cá chép. Ly là ly rượu, rượu. Cảnh nghèo. Càn rách một miếng thành ra quẻ Ly: là Đồng Nhân).
• Tượng của người quân tử. (Đồng Nhân là cùng người, nhưng giữa đồng và cùng cũng có sự khác nhau. Người quân tử lấy cái chung mà hợp nên là đồng. Kẻ tiểu nhân thì chỉ chuyên dùng ý riêng, người họ yêu thì trái họ cũng chung, người họ ghét thì dù phải họ cũng bài xích cho nên sự chung của họ là cùng là hùa đảng vậy).

•••

CUNG KHÔN

49. THUẦN KHÔN :
KHÔN thượng - KHÔN hạ
**Dịch tự :** có hình của người phụ nữ nắm quyền bính.

**Cách :** “Ngạ hổ đắc thực” (Hổ đói vớ được mồi). Đang lúc khó khăn sẽ gặp điều may mắn.

**Tượng :** “Địa thế Khôn” (Đất được gọi là Khôn).

**Nghĩa :**
• Là trinh cát, cái tốt của kẻ được mến yêu về nết trinh (mềm, trinh mới tốt. Việc cần cương thì hỏng. Thành công trong thế người ta thương yêu vì cái nết, cái đức mà được, đức thắng tài).
• Nhu thuận, sự bao bọc che chở (tượng trái đất bao bọc che chở vạn vật).
• “Tiên mê hậu đắc” (Trước mê muội sau được lợi). Ban đầu khó khăn, sau thành công tiếng tăm. Khôn nhu đến nỗi người ta không nỡ làm hại. ( Khác với quẻ Cổ : trước mê sau đổ nát ).
• Khôn là thứ (con thứ, cấp phó, quân sư, tỳ thiếp). Thi cử chỉ đứng thứ hai là cao. Bản mệnh ra quẻ Khôn : con gái không lợi. Không nên làm cấp trưởng.
• Lợi Tây nam, bất lợi Đông Bắc (Tây nam Khôn là nữ, Đông bắc Cấn là nam. Lợi cho nữ không lợi cho nam; lợi dụng nhu không lợi dụng cương).
• Là thê đạo (Đạo làm vợ), thần đạo (đạo bề tôi).
• Là sự hàn gắn, sự chắp nối lại, hàn lại, làm lại (như ly hôn sau quay lại lấy nhau. Nghĩa gần giống quẻ Phục, nhưng sự quay lại của Phục là để trả đũa, trả thù).
• Phụ nữ, đất, ngựa cái, vải vóc, quần áo, cái bụng, bà mẹ, con gái...

50. ĐỊA LÔI PHỤC :
KHÔN thượng - CHẤN hạ
**Dịch tự :** như người đang khó chịu quay mặt đi bụng vẫn tức.

**Cách :** “Phu thê phản mục” (vợ chồng trái mắt nhau).

**Tượng :** “Lôi tại địa trung” (Sấm nổ trong lòng đất). Bực bội trong lòng mà không nói ra được.

**Nghĩa :**
• Phục là phục hồi, phản phục, quay lại, trở về, về cội.
• “Bán thiên chiết sí” (giữa trời gãy cánh), giữa đường đứt gánh, đi nửa đường phải quay về, công việc mới tiến hành được một nửa thì gặp tai hoạ, nửa đường đứt gánh. Tối kỵ khi chọn kết hôn, làm việc chỉ được một nửa. Mệnh ra quẻ Phục thì công việc cứ hay phải làm đi làm lại nhiều lần.
• Sự phục binh, sự chờ đợi, mai phục, nằm im đợi thời cơ.
• Là sự tuần hoàn, chu kỳ (hết vòng lại quay lại).
• Hàn gắn, chắp nối lại (sự quay lại của Phục là để trả đũa, trả thù). Công việc không làm rồi quay lại làm. Đi lại : đi quá xa rồi quay lại.
• Âm dương tiêu trưởng (quẻ Cấu âm bắt đầu thắng, quẻ Phục là Dương quay trở lại để tiêu diệt âm, phục thù).
• Thu phục, nhận giữ lấy, giam giữ. (Trừ tà).
• Hào 1: Bất viễn phục (Đi không xa đã quay lại → tốt, không có gì để nói, chưa sai).
• Hào 2: Hưu phục (Đi chưa xa, còn gần hào 1 dương nên vui vẻ mà quay lại → vẫn tốt).
• Hào 3: Tần phục (Buồn rầu mà quay lại → đi xa rồi nên ngại quay về nhưng quay về vẫn còn có bạn, bắt đầu không đẹp, động hào này hoá ra Minh di).
• Hào 4: Trung hành độc phục (Giữa đường một mình quay về → dở, hoá ra quẻ Chấn là lục xung).
• Hào 5: Đôn phục (Ép buộc phải quay về → xấu, biến thành quẻ Truân).
• Hào 6: Mê phục (Đường mê thì khó về, đã bỏ lỡ cơ hội quay về).
• (Ý nghĩa các hào ngược lại quẻ Bác, hào 6 của Bác lại là đẹp nhất).
• Ghi chú: thời của Phục là trước Đông chí (là sự hàn gắn, chắp nối, phát tài... tốt), sau Đông chí là nghĩa xấu (ém quân, phục, chờ đợi…).
• Sơ đồ (Cấu – Phục): quẻ Cấu là âm bắt đầu thắng; quẻ Phục là dương quay lại.

51. ĐỊA TRẠCH LÂM :
KHÔN thượng - ĐOÀI hạ
**Cách :** “Phát chính thi nhân” (Làm điều nhân nghĩa). Mệnh: là người hay nói, sống nhân nghĩa.

**Tượng :** “Trạch thượng hữu địa” (Trên đầm có đất).

**Nghĩa :**
• Tới, tiến sát tới nơi, xu hướng tiến tới.
• Lớn, lớn lên, phát triển (nhưng sự phát triển chậm chạp, khó khăn do hào âm là bế tắc có tới 4 hào, chỉ có 2 hào dương thông suốt do đó mất thời gian).
• Vỗ về, an ủi (miệng nói là chính, giúp ít). (Sơ đồ: Đoài là miệng: nói tốt, có duyên).
• Sự xem xét, nhìn ngó (quẻ Lâm là quan sát tò mò, soi mói, là người trên, ở địa vị cao, cấp trên xem xét để đánh giá cấp dưới; vì là quẻ đại Đoài nên mang nữ tính thọc mạch. Khác quẻ Quán là quan sát một cách bàng quan, thờ ơ, bỏ mặc, không quan tâm, nhìn rồi đi thẳng).
• Sự hanh thông hữu hạn, chỉ tốt trong vòng 8 tháng, nếu để kéo dài dây dưa quá 8 tháng thì biến cát thành hung (Ví dụ: xin việc nếu đã đưa hồ sơ được 6 tháng rồi thì trong vòng hai tháng tới không xong thì hỏng hẳn).
• Lâm nạn, lâm chung (chết). Vì Lâm cũng là sự bắt đầu sinh trưởng của một quá trình khác, quá trình âm : Bĩ • Tấn • Độn • Lâm • Thái • Nhu (xem đồ hình: vòng tròn có các vị trí Vượng, Sinh, Mộ; phần trên +, phần dưới −).
• Tế lễ, cử hành tế lễ.

52. ĐỊA THIÊN THÁI :
KHÔN thượng - CÀN hạ
**Dịch tự :** tượng như người cầm ngọn đèn hải đăng trên biển.

**Cách :** “Hỷ báo tam nguyên” (Tin vui báo đỗ đầu ba giải). Tin vui đến dồn dập.

**Tượng :** “Thiên địa giao” (Trời đất giao nhau). (Khôn là âm giáng, Càn là dương thăng).

**Nghĩa :**
• Sáng, trong sáng. (Thời tiết: trời trong xanh, sáng).
• Thông, hanh thông, thông suốt (là hạnh phúc: con người luôn gặp thông suốt thì sướng vui, con người không gặp thông suốt thì tắc uất).
• Thái bình, thái hoà, bình yên, an ninh mọi mặt.
• Mùa xuân, vạn vật đâm chồi nảy lộc, sự phát triển, sinh trưởng.
• Phồn thịnh, phồn vinh, văn minh hoa lệ (cái đẹp của sự văn minh, giới quý tộc).
• Sự thay đổi kết thúc cái cũ (cùng), cái xấu chuẩn bị sang giai đoạn mới tốt hơn. “Hết cơn bĩ cực đến hồi thái lai”.
• Sự đoàn kết nhất trí.
• Nhà thờ, từ đường, nhà tiếp sứ thần, thái miếu (nhà khách chính phủ), điệu nhạc thái thường. (Ví dụ: xem về bệnh tật ra quẻ Thái hào 6 động là nhà từ đường có biến động ảnh hưởng đến con cháu).
• Ân sủng, bao dung, độ lượng. (Người trên ban ơn cho người dưới).
• Khu đất cao, gò cao, rộng rãi, bằng phẳng (Xem mồ mả ra quẻ Thái là đẹp).
• Chỉ sự hôn nhân, mối lương duyên tốt đẹp (thường là mối lương duyên chênh lệch nhau về địa vị, người địa vị thấp lấy được người địa vị cao).
• Sự duỗi ra (Ví dụ: xem bệnh tật được quẻ Thái biến Đại Súc là cơ thể đang duỗi bình thường bị chân tay co rút → khó chữa).

53. LÔI THIÊN ĐẠI TRÁNG :
CHẤN thượng - CÀN hạ
**Cách :** “Cộng sự đắc mục” (Người cộng sự vừa mắt, ưng ý).

**Tượng :** “Lôi tại thiên thượng” (Sấm ở trên trời). Chỉ sức mạnh.

**Nghĩa :**
• Đại tráng là tiến mạnh, lớn mạnh, sự thịnh vượng cường thịnh.
• Là sự cương cường, cứng rắn vì thế dễ gãy đổ. Ví như thanh thép cứng dễ gãy.
• Thường tốt cho trung sự (Người đứng giữa, môi giới, trung gian, giữa sự việc, giai đoạn giữa).
• Tượng ngựa non háu đá, dê non ngứa sừng húc bờ dậu (Phàm người ta không biết dùng trí, chỉ thích dùng sức mạnh, ỷ sức lấy thịt đè người ắt phải có lúc gãy quỵ).
• Sự hữu hoạ (có hoạ), tượng của sự thương tích chân tay, tai nạn (thường khi Đại tráng là quẻ biến thì ứng nhiều hơn).
• Là dịch mã, tượng của sự đi lại, đi nhanh (quẻ lục xung), tuy nhiên Đại Tráng là việc đi gắn với sự hỏng hóc về xe cộ: bánh xe, trục xe, vành xe (Hữu nguy: có nguy, hễ có thể đến hung mà nó chưa tới là gọi là nguy).

54. TRẠCH THIÊN QUẢI :
ĐOÀI thượng - CÀN hạ
**Cách :** “Du phong thoát võng” (Con ong thoát khỏi lưới).

**Tượng :** “Trạch thượng ư thiên” (Nước đầm dâng lên tận trời).

**Nghĩa :**
• Quải là quyết, cương quyết, quyết đoán (giữ quan điểm của mình đến cùng, giữ cương chính, cương quyết đến cùng sẽ thắng lợi).
• Sự vấp, vấp ngã, vướng ở đầu ngón chân (vấp ngã do vướng chân mà vấp, đi hấp tấp vướng sỏi đá mà ngã).
• Sự kêu gào, la hét, âm của thanh quản rung.
• Là gò má (quyền cốt), gò má cao (quyền cốt cao) (Nữ chỉ sự sát chồng). (Sơ đồ: Thiếu nữ; Xương; Cương nhiều (nhiều dương)).
• Là sự vỡ lở, vết nứt (Thuần Càn bị đứt một nét hào 6 thành Quải).
• Là kiện tụng tranh đấu (5 hào dương đuổi một hào âm → tranh đấu đến cùng). Kêu các cửa. Quải là văn bản quyết định.
• Quải trung sự là hoạ (ngược lại với quẻ Đại Tráng). (Người môi giới thiệt thòi).

55. THỦY THIÊN NHU :
KHẢM thượng - CÀN hạ
**Cách :** “Minh châu xuất thổ” (Hạt minh châu đã bắt đầu ra khỏi đất). Sự việc bắt đầu tiến triển. Nhân vật ẩn bắt đầu xuất hiện. Hòn ngọc quý ló ra khỏi đất.

**Tượng :** “Vân thướng ư thiên” (Mây bay cao trên trời). Trời âm u. Tượng sự việc bắt đầu phát triển.

**Nghĩa :**
• Là đợi, chờ đợi (chỉ thời cơ chưa đến, mà sắp đến (sẽ đến)).
• Nhu là sự ăn uống, dự tiệc (tiệc cưới, tiệc mừng sinh nhật).
• Là chiếc nhẫn cưới, viên kim cương, hạt minh châu. (Sơ đồ: Khảm viên đá trong, Càn là kim, vàng, tròn → Viên kim cương đính trên nhẫn cưới).
• Lòng tin, đức tin, sự chung thuỷ.
  • *Trung Phu*: bàn về chữ tín (chưa chắc là người tin, chung thuỷ, sống thường mất tín).
  • *Nhu*: có đức tín thật (việc sẽ thành, có lòng tin).
  • *Ví dụ xin việc*: Trung Phu là không thật. Nhu: yên tâm, sống thật.
• Quần áo, vải vóc, quân nhu (軍需 quân nhu: đồ dùng trong quân đội).
• Sự mềm mại, nhu thuận, là phép dùng nhu chế cương, ngoài nhu trong cương.
  • *Thiên Thuỷ Tụng*: Ngoài nhu trong cương. Tối, tiểu nhân, hung.
  • *Thuỷ Thiên Nhu*: Trong cương ngoài nhu, hoà theo không bè đảng. Sáng, quân tử, vô lỗi, cát.
• Là bùn đất (nê). Nếu Nhu bị tổn thương là bùn đất vào quan tài, sập nắp quan tài, xương đen... Quẻ Nhu chỉ đẹp cho dương trạch.
  • Bùn đất trong quan tài: bốc nhanh, cải táng nhanh tránh tai vạ.
  • Nhà cửa: nước thải dưới nền nhà (hay bị khớp).

56. THỦY ĐỊA TỶ :
KHẢM thượng - KHÔN hạ
**Cách :** “Thuyền đắc thuận phong” (Thuyền xuôi gặp gió).

**Tượng :** “Địa thặng hữu thuỷ” (Trên đất có nước).

**Nghĩa :**
• Tỷ là gần nhau, liền kề nhau, dựa vào nhau, giúp nhau, sự liên minh (sự kết hợp chứ không phải là thể thống nhất, về đại thể lợi ích và mục đích khác nhau). Ví như là liên bang chứ không phải là dân tộc.
• Là anh em, bạn bè (huynh đệ tỷ muội), người nhà.
• Là giáp, giáp biên, liền kề, lân cận tả hữu, hàng xóm.
• Là ghen tị, ganh đua, dèm pha, thị phi, khẩu thiệt. (Ví dụ xem về làm nhà là hàng xóm ghen tị…).
• Là tiến thẳng về phía trước (lùi là thua, con đường duy nhất để chiến thắng của quẻ Tỷ).

•••

CUNG ĐOÀI

57. THUẦN ĐOÀI :
ĐOÀI thượng - ĐOÀI hạ
**Cách :** “Lưỡng trạch tương tụ” (Hai cái đầm tương thông nhau) gắn bó, nối kết nhau, thông đồng.

**Tượng :** “Lệ trạch đoài” (Lệ: bám, sự bám chặt).

**Nghĩa :**
• Đẹp lòng (Đoài cứng trong mà mềm ngoài, cứng trong nên đẹp lòng mà hanh, đẹp lòng thì lợi về chính bền). Bám của Đoài khác với bám của Tốn (hiền từ), ngoài mềm trong cứng (có suy nghĩ), khác với mềm của thuần Khảm (mềm thủ đoạn) → đẹp lòng hanh thông (đạt kết quả như mong muốn). Thuần Đoài là hai cái miệng: nhanh nhẹn thông minh.
• Là duyệt, sự phê duyệt, sự ưng thuận vì vậy gọi là “cận duyệt viễn lai” (gần duyệt xa bằng lòng).
• Là lệ (đẹp, tráng lệ, mỹ lệ). Tươi vui nhanh nhẹn.
• Là mồm miệng, ăn nói khéo léo, đồng thời là tượng của sự tranh cãi.
• Là song hỷ, tượng hôn nhân lễ cưới “song hỷ lâm môn cách”.
• Là bằng hữu giảng tập (bạn bè trao đổi kinh nghiệm) “lưỡng trạch tương tụ”. Hai người có tri thức trao đổi với nhau để cùng tiến bộ.
• Sự khiếm khuyết, sự thiếu hụt, sự sai sót một chút nào đó (Vì Đoài là Càn đứt một nét mà thành).
• Là ngăn kéo tủ, giá sách, tượng mồ mả, nhà cửa, âm phần. Đoài động ra phụ mẫu là mồ mả, lâm Bạch hổ là tang tóc.

58. TRẠCH THỦY KHỐN :
ĐOÀI thượng - KHẢM hạ
**Cách :** “Loát hãn du thê” (Leo thang ở vách núi dựng đứng). Khá nguy hiểm, khốn khổ. (Thê: thang).

**Tượng :** “Trạch vô thuỷ” (Đầm không có nước). Hạn hán khô kiệt.

**Nghĩa :**
• Khốn cùng, gian nan, sự mệt mỏi khốn cùng do thiếu thốn.
  • *Trạch Thuỷ Khốn*: Khốn thường xuyên lâu dài.
  • *Thuỷ Lôi Truân*: Khốn tạm thời một giai đoạn nào đó.
• Là bị hãm, bị mắc, người quân tử bị tiểu nhân che lấp (thời thế của mình đã hết, khuyên ta biết chấp nhận số phận tự nhiên, nên vui trời yên mệnh, tốt hơn là giữ trinh, chính của mình thì cát, qua cơn khốn).
• Là nội tự cường (Nếu có hành động thì nên hành động im lặng, không nên làm vang động, “bất thuyết xuất khứ” thì mưu sự sẽ thành, không nói ra lời thì sẽ cát).
• Khốn là sự ăn uống nhậu nhẹt mà gặp hoạ. (Sơ đồ: Đoài: hóc xương; Khảm: say sưa, xe cộ).
• Khốn là hoạ. Hoạ lớn của tiểu nhân, hoạ nhỏ của người quân tử: bởi kẻ tiểu nhân gặp thời khốn thì quẫn làm bậy mà thành họa lớn, người quân tử gặp thời khốn thì suy đến mệnh, biết mệnh phải thế nên không rối trí chỉ làm điều chính. Bởi không biết mệnh của mình, lo sợ hiểm nạn, cuống thì cái thao thủ (kiên định, luôn giữ khí tiết) của mình sẽ mất đi mà sinh đại hoạ. Vậy mới nói rằng: cái làm cho người ta khốn chỉ là sự muốn của mình mà thôi.

59. TRẠCH ĐỊA TỤY :
ĐOÀI thượng - KHÔN hạ
**Cách :** “Ngư hoá vi long” (Cá chép hoá rồng). Tượng sự thành đạt, khó khăn được giải thoát.

**Tượng :** “Trạch thượng ư địa” (Trên đất có đầm).

**Nghĩa :**
• Tuỵ là tụ, tụ họp, nhóm lại. (Nước tụ trên đất…).
• Hoán, hoán cải, thay đổi (chuyển đổi sang trạng thái mới, tính chất thúc giục hơn quẻ Cách. Chuyển từ trạng thái cũ sang trạng thái mới tốt hơn. Quẻ đời người ra Tuỵ: nửa đời thay đổi công việc, đừng luyến tiếc sự vang bóng một thời công việc mới sẽ tốt hơn, nếu không sẽ bế tắc).
• Tụy là tòng, tòng theo, tòng thuộc, theo một việc gì đó, theo một ai đó.
• Tiều tụy, khổ sở, rách rưới. Tượng người ăn mày. Đoài là cái miệng xin ăn, Khôn dưới là cái bụng rỗng.
• Tụy là lễ, lễ lớn (đại lễ) lễ lớn mới cát lễ nhỏ không ăn thua (khác với quẻ Lý là lễ nhỏ). Vì Tụy có Đoài trên, Khôn dưới. Khôn là thuận theo, Đoài là đẹp lòng hỷ duyệt. Thuận theo mà họp lại là Tụy, nên Tụy là lễ lớn mà chính đính vậy.

60. TRẠCH SƠN HÀM :
ĐOÀI thượng - CẤN hạ
**Cách :** “Manh nha xuất thổ” (Chồi non đã nhú).

**Tượng :** “Sơn thượng hữu trạch” (Trên núi có đầm). Âm phần là thế “Phi long xuất dương”.

**Nghĩa :**
• Hàm là cảm, giao cảm, cảm ứng, cảm tình, cảm động, thần giao cách cảm (Hình tượng quẻ là huyệt Bách hội ở trên mở ra để đón nhận năng lượng).
• Hằng là tiền hôn nhân, tình yêu nam nữ.
  • *Hàm* là tượng đang yêu, Đoài là gái ở trên: trai đi theo gái. Lấy sự đẹp lòng làm chủ. Nam nữ trẻ tuổi.
  • *Hằng* là đạo vợ chồng, Chấn nam ở trên: vợ phải theo chồng. Lấy sự chính làm gốc. Có tuổi, chín chắn.
• Sự thông suốt, thuận lợi, sự việc bắt đầu phát triển tốt. (Trời đất cảm nhau thì vạn vật hoá sinh, con người cảm nhau thì thế giới hoà bình, vạn sự thông suốt, vì thế mà nói Hàm là “Manh nha xuất thổ”).
• Hàm là bị thương (“Dịch tự bản nghĩa”) trên các bộ phận cơ thể:
  • Hào 1: Hàm kỳ mẫu (bị thương ở ngón chân).
  • Hào 2: Hàm kỳ phi (bị thương ở bắp chân).
  • Hào 3: Hàm kỳ cổ (Bị thương ở bắp đùi).
  • Hào 4: Hàm kỳ tâm (Bị thương ở tim).
  • Hào 5: Hàm kỳ mỗi (Bị thương ở thăn lưng).
  • Hào 6: Hàm kỳ phụ (Bị thương vùng mặt).
  • *Ghi chú hào 4*: “Hàm kỳ tâm, trinh cát, hối vong, đồng đồng vãng lai, bằng tòng nhĩ tứ” (Bị thương ở trong tim, nhưng hãy cứ kiên trì chịu đựng thì tốt, nếu hối tiếc (nản lòng) thì sẽ tiêu vong. Hãy suy xét cho kỹ, chỉ nên để tâm đến những người đi theo phò tá cho mình thôi).

61. THỦY SƠN KIỂN :
KHẢM thượng - CẤN hạ
**Cách :** “Vũ tuyết đại đô” (Mưa tuyết ngang đường).

**Tượng :** “Sơn thượng hữu thuỷ” (Trên núi có nước).

**Nghĩa :**
• Gian nan, khó khăn, cản trở, sự hiểm trở, hãm hiểm tiến thoái lưỡng nan (trước là Khảm: vực sâu, sau lưng là Cấn: núi cao).
• Là tai nạn què chân, chân không đi được (bất túc tiện) người bị thọt (Đỉnh: gãy chân).
• Lợi Tây Nam bất lợi Đông Bắc (lợi nữ không lợi nam, lợi kiến đại nhân bất lợi gặp tiểu nhân, lợi tĩnh không lợi động).

62. ĐỊA SƠN KHIÊM :
KHÔN thượng - CẤN hạ
**Cách :** “Nhị nhân phân kim” (Hai người chia nhau vàng).

**Tượng :** “Địa trung hữu sơn” (Trong đất có núi) hang cùng ngõ hẻm.

**Nghĩa :**
• Thoái lui, thoái thác, thoái nhiệm, lùi bước.
• Khiêm tốn, nhún nhường (Ngoài là Khôn: thuận, trong là Cấn: dừng).
• Trước co sau duỗi, trước khó khăn sau thuận lợi, tiền cát hậu hung (Quẻ Đại súc là sự co lại, quẻ Thái là duỗi ra, quẻ Khiêm là chỉ quá trình trước co sau duỗi. Ví dụ: Xem bệnh đang bị chứng co quắp sau do điều trị mà duỗi ra đi lại được). Lùi một bước tiến nhiều bước.
• Tượng người phụ nữ có chồng (Nếu hỏi hôn nhân: tái giá).

63. LÔI SƠN TIỂU QUÁ :
CHẤN thượng - CẤN hạ
**Cách :** “Phi điểu di âm” (Chim đã bay đi còn lại tiếng kêu).

**Tượng :** “Sơn thượng hữu lôi” (Trên núi có sấm).

**Nghĩa :**
• Sự nhỏ mà vượt quá, lỗi nhỏ, nhầm lẫn nhỏ.
• “Tiểu giả quá đa” (những cái nhỏ đều qua được hết). Tức là gặp thì tiểu sự cát, đại sự hung. Tiểu Quá là quá mức thường một chút, vì vậy nếu có bị quá đi một chút thì sẽ hanh thông.
• Làm lại (làm đi làm lại, đi rồi quay lại tuy nhiên không xa như Đại quá).
• Thông tin, cánh chim bay (đưa thư), xe cộ, sự đi lại (ô tô, máy bay). “Phi điểu di âm”.
• Hiểu nhầm, bất hoà, ngoài hư trong thực.
• Tai hoạ nhỏ (thường là tai nạn chân tay). “Phi điểu dĩ thỉ, hung”.
• Tiểu Quá là không nên tham vọng lớn sẽ gặp nguy hiểm, nếu lui về giữ vị trí thấp an toàn hơn, nên chọn người dưới đừng cậy người cao. Nếu có đi giao dịch cũng chỉ gặp được cấp dưới, không gặp được cấp trên, có tiểu lợi thôi.

64. LÔI TRẠCH QUY MUỘI :
CHẤN thượng - ĐOÀI hạ
**Cách :** “Duyên mộc cầu ngư” (Đơm đó ngọ tre).

**Tượng :** “Trạch thượng hữu lôi” (Trên đầm có sấm).

**Nghĩa :**
• Gái về nhà chồng.
• Quy muội là tượng gái chạy theo theo trai, chưa cưới nhau mà gái chạy theo trai là bất chính vì vậy mà nói “Quy muội trinh hung” ( Chấn trai trên động, gái dưới theo trai ) trái với đạo quẻ Hàm.
• Vợ lẽ, tỳ thiếp (hào sơ không có ứng nên là tượng vợ lẽ).
• Quay về, trở lại, là về nhà mới, cũng là tượng cái chết (về với tổ tiên, về với đất), tượng âm phần mồ mả ( Quy muội là quẻ quy hồn lại thuộc cung Đoài ).
• Tai nạn ở mắt, chột mắt, mù mắt (mảnh kim khí bắn vào mắt).
• Lợi giao dịch mua bán, tiến hành nhanh chóng, có lợi ( Chấn : động, Đoài : thuận có chủ ý → người bán thì muốn bán nhanh, người mua là muốn mua ngay và thuận theo giá đó nên phát giá bán, đồng ý mua luôn ai cũng thấy vừa ý ).
